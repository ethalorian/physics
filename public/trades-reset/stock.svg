<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img"><title>stock teaching diagram</title><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25434e"/></marker></defs><rect width="800" height="410" rx="16" fill="#fff"/><g stroke="#25434e" stroke-width="2" fill="none"><rect x="90" y="125" width="620" height="90" fill="#edf3f4"/><rect x="225" y="125" width="12" height="90" fill="#b24332" stroke="none"/><rect x="370" y="125" width="12" height="90" fill="#b24332" stroke="none"/><rect x="515" y="125" width="12" height="90" fill="#b24332" stroke="none"/><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="150" y="175" font-size="20" text-anchor="middle">part</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="300" y="175" font-size="20" text-anchor="middle">part</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="445" y="175" font-size="20" text-anchor="middle">part</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="620" y="175" font-size="18" text-anchor="middle">leftover</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="400" y="70" font-size="23" text-anchor="middle">STOCK = PARTS + CUT LOSS + LEFTOVER</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="400" y="272" font-size="19" text-anchor="middle">Red bands represent a stated cutting allowance</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="400" y="320" font-size="22" text-anchor="middle">Check whole pieces fit before buying stock</text></g></svg>