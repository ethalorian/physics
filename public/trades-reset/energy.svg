<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img"><title>energy teaching diagram</title><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25434e"/></marker></defs><rect width="800" height="410" rx="16" fill="#fff"/><g stroke="#25434e" stroke-width="2" fill="none"><rect x="60" y="125" width="180" height="150" fill="#e3efed" rx="12"/><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="150" y="180" font-size="24" text-anchor="middle">POWER</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="150" y="225" font-size="19" text-anchor="middle">V × A = W</text><rect x="315" y="125" width="180" height="150" fill="#e3efed" rx="12"/><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="405" y="180" font-size="24" text-anchor="middle">TIME</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="405" y="225" font-size="19" text-anchor="middle">hours</text><rect x="570" y="125" width="180" height="150" fill="#e3efed" rx="12"/><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="660" y="180" font-size="24" text-anchor="middle">ENERGY</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="660" y="225" font-size="19" text-anchor="middle">W × h = Wh</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="277" y="210" font-size="30" text-anchor="middle">×</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="527" y="210" font-size="30" text-anchor="middle">=</text><text fill="#203c48" stroke="none" font-family="Arial,sans-serif" x="400" y="345" font-size="24" text-anchor="middle">1,000 Wh = 1 kWh</text></g></svg>