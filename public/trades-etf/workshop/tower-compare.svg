<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" role="img" aria-label="tower: compare teaching view"><title>tower: compare teaching view</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc562d"/></marker></defs><rect width="840" height="490" rx="16" fill="#fffdf7"/><g font-family="Arial,Helvetica,sans-serif"><polygon points="190,354 270,354 232,325 232,120 190,144" fill="#c9e6dd" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><polygon points="270,354 232,325 232,120 270,144" fill="#8db9b0" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><polygon points="510,354 590,354 552,325 552,120 510,144" fill="#c9e6dd" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><polygon points="590,354 552,325 552,120 590,144" fill="#8db9b0" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><polygon points="155,144 580,144 653,86 229,86" fill="#e5ac48" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><rect x="356" y="52" width="94" height="48" rx="3" fill="#fffdf7" stroke="#183c44" stroke-width="3" /><text x="325" y="29" font-size="24" fill="#183c44" text-anchor="start" font-weight="600">Load at center</text><rect x="183" y="337" width="408" height="24" rx="3" fill="#bc562d" stroke="#183c44" stroke-width="3" /><text x="330" y="399" font-size="24" fill="#183c44" text-anchor="start" font-weight="600">Base ties resist spreading</text><text x="30" y="435" font-size="23" fill="#183c44" text-anchor="start" font-weight="600">Add one clip every 5 seconds. Stop at failure or 10 clips.</text><text x="30" y="466" font-size="20" fill="#587378" text-anchor="start" font-weight="600">Same cup, position and platform • held 10 = test cap, not maximum strength.</text></g></svg>