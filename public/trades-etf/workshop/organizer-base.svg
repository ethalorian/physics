<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" role="img" aria-label="organizer: base teaching view"><title>organizer: base teaching view</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc562d"/></marker></defs><rect width="840" height="490" rx="16" fill="#fffdf7"/><g font-family="Arial,Helvetica,sans-serif"><polygon points="92,340 596,340 740,172 236,172" fill="#eef6f1" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><polygon points="236,172 740,172 740,76 236,76" fill="#c9e6dd" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><polygon points="92,340 596,340 596,244 92,244" fill="#c9e6dd" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><text x="220" y="374" font-size="23" fill="#183c44" text-anchor="start" font-weight="600">F · one continuous front wall</text><text x="390" y="55" font-size="23" fill="#183c44" text-anchor="start" font-weight="600">R · rear wall</text><line x1="487" y1="66" x2="487" y2="77" stroke="#183c44" stroke-width="3" /><text x="206" y="203" font-size="27" fill="#183c44" text-anchor="start" font-weight="600">B · base</text><text x="30" y="435" font-size="23" fill="#183c44" text-anchor="start" font-weight="600">Start with the base and the two long walls.</text><text x="30" y="466" font-size="20" fill="#587378" text-anchor="start" font-weight="600">Stand F and R on top of B, with their outside faces flush to its edges.</text></g></svg>