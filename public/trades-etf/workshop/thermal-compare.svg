44" text-anchor="middle" font-weight="600">TEST CUP</text><text x="640" y="372" font-size="24" fill="#183c44" text-anchor="middle" font-weight="600">60 g ice · 20 min</text><rect x="556" y="138" width="168" height="35" rx="3" fill="#bc562d" stroke="#183c44" stroke-width="3" /><text x="30" y="435" font-size="23" fill="#183c44" text-anchor="start" font-weight="600">Change one feature: add the top collar, then run a new control.</text><text x="30" y="466" font-size="20" fill="#587378" text-anchor="start" font-weight="600">Drain for 30 seconds • weigh each result • keep every reading.</text></g></svg>