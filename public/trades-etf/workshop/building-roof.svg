<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" role="img" aria-label="building: roof teaching view"><title>building: roof teaching view</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc562d"/></marker></defs><rect width="840" height="490" rx="16" fill="#fffdf7"/><g font-family="Arial,Helvetica,sans-serif"><polygon points="85,335 570,335 740,204 255,204" fill="#eef6f1" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><polygon points="255,204 740,204 740,81 255,81" fill="#c9e6dd" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><polygon points="570,335 740,204 740,81 570,212" fill="#8db9b0" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><polygon points="85,335 255,204 255,81 85,212" fill="#c9e6dd" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><polygon points="85,335 153,335 153,233 243,233 243,335 570,335 570,212 85,212" fill="#c9e6dd" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><polygon points="153,335 205,298 205,196 153,233" fill="#e5ac48" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><text x="252" y="385" font-size="25" fill="#183c44" text-anchor="start" font-weight="600">Door swings inward at least 90°</text><polygon points="112,177 597,177 767,46 282,46" fill="#eef6f1" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><line x1="486" y1="185" x2="486" y2="258" stroke="#bc562d" stroke-width="5" marker-end="url(#arrow)"/><text x="48" y="39" font-size="26" fill="#183c44" text-anchor="start" font-weight="600">Removable 8 × 6-in roof</text><text x="30" y="435" font-size="23" fill="#183c44" text-anchor="start" font-weight="600">Keep the opening free. Check furniture and door clearance.</text><text x="30" y="466" font-size="20" fill="#587378" text-anchor="start" font-weight="600">The floor plan and wall elevation must describe the same room.</text