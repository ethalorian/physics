<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" role="img" aria-label="organizer: fit teaching view"><title>organizer: fit teaching view</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc562d"/></marker></defs><rect width="840" height="490" rx="16" fill="#fffdf7"/><g font-family="Arial,Helvetica,sans-serif"><rect x="122" y="87" width="540" height="270" rx="3" fill="#eef6f1" stroke="#183c44" stroke-width="3" /><rect x="122" y="87" width="540" height="8.4375" rx="3" fill="#c9e6dd" stroke="#183c44" stroke-width="3" /><rect x="122" y="348.5625" width="540" height="8.4375" rx="3" fill="#c9e6dd" stroke="#183c44" stroke-width="3" /><line x1="480" y1="103.4375" x2="480" y2="340.5625" stroke="#bc562d" stroke-width="5" /><text x="160" y="215" font-size="28" fill="#183c44" text-anchor="start" font-weight="600">Measure the gap</text><text x="160" y="249" font-size="23" fill="#183c44" text-anchor="start" font-weight="600">between inside faces.</text><text x="530" y="207" font-size="24" fill="#183c44" text-anchor="start" font-weight="600">Fitted</text><text x="530" y="239" font-size="24" fill="#183c44" text-anchor="start" font-weight="600">length</text><text x="30" y="435" font-size="23" fill="#183c44" text-anchor="start" font-weight="600">Do not force a 6-in blank between the long walls.</text><text x="30" y="466" font-size="20" fill="#587378" text-anchor="start" font-weight="600">At ⅛-in stock: 6 − ⅛ − ⅛ = 5¾ in. Use your actual gap.</text></g></svg>