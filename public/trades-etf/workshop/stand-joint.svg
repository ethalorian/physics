<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" role="img" aria-label="stand: joint teaching view"><title>stand: joint teaching view</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc562d"/></marker></defs><rect width="840" height="490" rx="16" fill="#fffdf7"/><g font-family="Arial,Helvetica,sans-serif"><polygon points="210,343 410,119 610,343" fill="#eef6f1" stroke="#183c44" stroke-width="3" stroke-linejoin="round" /><line x1="210" y1="343" x2="410" y2="119" stroke="#137e83" stroke-width="8" /><line x1="410" y1="119" x2="610" y2="343" stroke="#137e83" stroke-width="8" /><line x1="210" y1="343" x2="610" y2="343" stroke="#183c44" stroke-width="9" /><text x="275" y="211" font-size="29" fill="#183c44" text-anchor="start" font-weight="600">F</text><text x="524" y="211" font-size="29" fill="#183c44" text-anchor="start" font-weight="600">R</text><text x="412" y="374" font-size="25" fill="#183c44" text-anchor="middle" font-weight="600">B · 4 in</text><text x="422" y="70" font-size="23" fill="#137e83" text-anchor="middle" font-weight="600">SIDE VIEW</text><line x1="211" y1="337" x2="243" y2="302" stroke="#e5ac48" stroke-width="15" /><line x1="103" y1="253" x2="214" y2="316" stroke="#bc562d" stroke-width="5" marker-end="url(#arrow)"/><text x="38" y="221" font-size="25" fill="#183c44" text-anchor="start" font-weight="600">Tab inside F</text><text x="30" y="435" font-size="23" fill="#183c44" text-anchor="start" font-weight="600">Close the triangle. Overlap the ½-in tab inside F.</text><text x="30" y="466" font-size="20" fill="#587378" text-anchor="start" font-weight="600">The tab forms a joint; it does not add a fourth side.</text></g></svg>