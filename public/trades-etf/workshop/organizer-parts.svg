e</text><text x="420" y="30" font-size="26" fill="#183c44" text-anchor="start" font-weight="600">2 long walls</text><text x="420" y="238" font-size="23" fill="#183c44" text-anchor="start" font-weight="600">4 short-wall blanks</text><text x="30" y="435" font-size="23" fill="#183c44" text-anchor="start" font-weight="600">Seven parts. Two internal dividers make three bays.</text><text x="30" y="466" font-size="20" fill="#587378" text-anchor="start" font-weight="600">Cut short walls as 6 × 2-in blanks; fit their length to the actual gap.</text></g></svg>