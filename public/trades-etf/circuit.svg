<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img"><title>J · Two-room circuit: complete paths and all control states</title><desc>Original classroom construction plan with labeled parts and finished views. Not to scale. Use written dimensions and numbered lesson steps.</desc><rect width="1000" height="700" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183c44;stroke:none}line,path,polygon,rect,circle{stroke:#28636a;stroke-width:2.2} </style><text x="28" y="38" font-size="27">J · Two-room circuit: complete paths and all control states</text><text x="40" y="85" font-size="21">TWO INDEPENDENT BRANCHES</text><line x1="90" y1="240" x2="90" y2="135"/><line x1="90" y1="135" x2="205" y2="135"/><line x1="205" y1="135" x2="205" y2="400"/><line x1="90" y1="285" x2="90" y2="490"/><line x1="90" y1="490" x2="635" y2="490"/><line x1="635" y1="190" x2="635" y2="490"/><line x1="65" y1="240" x2="115" y2="240"/><line x1="75" y1="285" x2="105" y2="285"/><text x="45" y="240" font-size="20">+</text><text x="45" y="289" font-size="20">−</text><text x="52" y="333" font-size="20">3 V</text><line x1="205" y1="190" x2="275" y2="190"/><line x1="275" y1="190" x2="330" y2="160"/><line x1="350" y1="190" x2="467" y2="190"/><circle cx="490" cy="190" r="23" fill="white"/><line x1="475" y1="175" x2="505" y2="205"/><line x1="475" y1="205" x2="505" y2="175"/><line x1="513" y1="190" x2="635" y2="190"/><circle cx="205" cy="190" r="4" fill="#185e65"/><circle cx="635" cy="190" r="4" fill="#185e65"/><text x="286" y="140" font-size="21">S1</text><text x="471" y="150" font-size="21">L1</text><text x="440" y="223" font-size="17">A</text><text x="523" y="223" font-size="17">B</text><line x1="205" y1="400" x2="275" y2="400"/><line x1="275" y1="400" x2="330" y2="370"/><line x1="350" y1="400" x2="467" y2="400"/><circle cx="490" cy="400" r="23" fill="white"/><line x1="475" y1="385" x2="505" y2="415"/><line x1="475" y1="415" x2="505" y2="385"/><line x1="513" y1="400" x2="635" y2="400"/><circle cx="205" cy="400" r="4" fill="#185e65"/><circle cx="635" cy="400" r="4" fill="#185e65"/><text x="286" y="350" font-size="21">S2</text><text x="471" y="360" font-size="21">L2</text><text x="440" y="433" font-size="17">A</text><text x="523" y="433" font-size="17">B</text><text x="704" y="139" font-size="21">STATE TEST</text><text x="704" y="186" font-size="20">S1  S2   L1  L2</text><text x="704" y="231" font-size="18">OFF OFF  off off</text><text x="704" y="272" font-size="18">ON  OFF  on  off</text><text x="704" y="313" font-size="18">OFF ON   off on</text><text x="704" y="354" font-size="18">ON  ON   on  on</text><text x="40" y="550" font-size="19">Six leads: +→S1 input; S1 output→L1 A; L1 B→−. Repeat independently for S2/L2.</text><text x="40" y="590" font-size="19">Room model: 8 × 6-in base; 3-in walls; divider x=4. Lamp centers (2,3), (6,3).</text><text x="40" y="630" font-size="20">Day 6 onward: replace S2 with foil-jaw door switch. L2 ON when door OPEN.</text><text x="28" y="676" font-size="18">NTS • Use written dimensions, not pixels or printed scale. Follow the numbered lesson.</text></svg>