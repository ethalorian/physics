<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="715" viewBox="0 0 1000 715" role="img"><title>A · Instruction-card stand: finished form and flat pattern</title><desc>Original classroom construction plan with labeled parts and finished views. Not to scale. Use written dimensions and numbered lesson steps.</desc><rect width="1000" height="715" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183c44;stroke:none}line,path,polygon,rect,circle{stroke:#28636a;stroke-width:2.2} </style><text x="28" y="38" font-size="27">A · Instruction-card stand: finished form and flat pattern</text><text x="40" y="85" font-size="21">FINISHED OBJECT · side view</text><polygon points="100,285 400,285 250,120" fill="#e5f1ef"/><line x1="100" y1="285" x2="250" y2="120"/><line x1="110" y1="279" x2="127" y2="260"/><text x="87" y="210" font-size="25">F</text><text x="360" y="202" font-size="25">R</text><text x="230" y="311" font-size="20">B · 4 in</text><text x="140" y="166" font-size="19">3 in</text><text x="306" y="166" font-size="19">3 in</text><line x1="86" y1="294" x2="150" y2="294"/><line x1="150" y1="294" x2="138" y2="282"/><text x="42" y="340" font-size="18">L: shelf projects forward</text><text x="42" y="364" font-size="18">T overlaps inside F at bottom</text><polygon points="90,284 240,119 234,114 84,279" fill="#f8e7ba"/><text x="420" y="193" font-size="20">3 × 5-in card</text><line x1="410" y1="202" x2="194" y2="216"/><text x="420" y="224" font-size="18">leans on F;</text><text x="420" y="248" font-size="18">bottom edge rests on L</text><text x="640" y="88" font-size="21">WHAT YOU TURN IN</text><text x="640" y="128" font-size="20">1 triangular stand</text><text x="640" y="160" font-size="20">1 test card</text><text x="640" y="192" font-size="20">2 tested lip depths</text><text x="640" y="224" font-size="20">6 pass/fail trials</text><text x="40" y="412" font-size="21">FLAT CUT/FOLD PLAN · body 10 1/2 × 4 in</text><rect x="80" y="445" width="630" height="140" fill="#e5f1ef"/><line x1="260" y1="445" x2="260" y2="585" stroke-dasharray="8 6"/><text x="252" y="611" font-size="18">3</text><line x1="440" y1="445" x2="440" y2="585" stroke-dasharray="8 6"/><text x="432" y="611" font-size="18">6</text><line x1="680" y1="445" x2="680" y2="585" stroke-dasharray="8 6"/><text x="672" y="611" font-size="18">10</text><text x="80" y="610" font-size="18">A / 0</text><text x="720" y="610" font-size="18">10 1/2 in</text><text x="125" y="515" font-size="18">F · 3</text><text x="315" y="515" font-size="18">R · 3</text><text x="510" y="515" font-size="18">B · 4</text><text x="687" y="515" font-size="18">T</text><text x="737" y="510" font-size="20">width 4 in</text><text x="737" y="543" font-size="18">T = 1/2-in tab</text><text x="40" y="647" font-size="18">Separate L: 4 × 1 in; fold lengthwise at 1/2 in. Revision B lip: 4 × 1 1/2 in.</text><text x="28" y="691" font-size="18">NTS • Use written dimensions, not pixels or printed scale. Follow the numbered lesson.</text></svg>