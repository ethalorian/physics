<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img"><title>E · Community room: coordinated plan, elevation and assembly</title><desc>Original classroom construction plan with labeled parts and finished views. Not to scale. Use written dimensions and numbered lesson steps.</desc><rect width="1000" height="760" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183c44;stroke:none}line,path,polygon,rect,circle{stroke:#28636a;stroke-width:2.2} </style><text x="28" y="38" font-size="27">E · Community room: coordinated plan, elevation and assembly</text><text x="35" y="85" font-size="22">PLAN · model 8 × 6 in</text><rect x="75" y="123" width="400" height="270" fill="white"/><text x="95" y="158" font-size="20">N ↑</text><rect x="123" y="371" width="75" height="25" fill="white"/><line x1="123" y1="393" x2="123" y2="320"/><text x="46" y="429" font-size="18">SW datum</text><text x="119" y="462" font-size="18">1-in offset; opening 1 1/2 in</text><text x="35" y="514" font-size="22">SOUTH ELEVATION · 8 × 4 in</text><rect x="75" y="535" width="400" height="160" fill="#e5f1ef"/><rect x="125" y="555" width="75" height="140" fill="#f8e7ba"/><line x1="125" y1="555" x2="125" y2="695" stroke-dasharray="8 6"/><text x="225" y="627" font-size="18">Door 1 1/2 × 3 1/2 in</text><text x="223" y="658" font-size="17">Fold left; cut top/right</text><text x="540" y="85" font-size="22">FINISHED MODEL · roof lifts off</text><polygon points="610,160 900,160 950,110 660,110" fill="#c6e2dd"/><polygon points="610,295 900,295 950,245 660,245" fill="#edf6f3"/><polygon points="610,295 900,295 900,415 610,415" fill="#d3e8e3"/><polygon points="900,295 950,245 950,365 900,415" fill="#c6e2dd"/><rect x="647" y="310" width="53" height="105" fill="white"/><polygon points="647,415 607,391 607,286 647,310" fill="#f8e7ba"/><text x="540" y="469" font-size="22">CUT LIST</text><text x="540" y="508" font-size="19">Base: 8 × 6 in</text><text x="540" y="539" font-size="19">N/S: two 8 × 4-in walls</text><text x="540" y="570" font-size="19">E/W: two 6 × 4-in blanks; trim to fit</text><text x="540" y="601" font-size="19">Roof: 8 × 6 in, made on day 6</text><text x="540" y="632" font-size="19">Scale: 1/2 in = 1 ft</text><text x="540" y="663" font-size="19">Represents 16 × 12 ft; 8-ft walls</text><text x="28" y="736" font-size="18">NTS • Use written dimensions, not pixels or printed scale. Follow the numbered lesson.</text></svg>