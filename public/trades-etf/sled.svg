<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img"><title>G2 · Syringe-powered delivery sled: fixed and moving parts</title><desc>Original classroom construction plan with labeled parts and finished views. Not to scale. Use written dimensions and numbered lesson steps.</desc><rect width="1000" height="700" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183c44;stroke:none}line,path,polygon,rect,circle{stroke:#28636a;stroke-width:2.2} </style><text x="28" y="38" font-size="27">G2 · Syringe-powered delivery sled: fixed and moving parts</text><text x="35" y="85" font-size="22">ASSEMBLY · TOP VIEW</text><rect x="65" y="125" width="840" height="360" fill="white"/><line x1="65" y1="305" x2="905" y2="305" stroke-dasharray="8 6"/><text x="77" y="112" font-size="20">Base 12 × 6 in; datum A at front-left</text><text x="71" y="510" font-size="18">A (0,0)</text><line x1="275" y1="305" x2="140" y2="305"/><line x1="140" y1="305" x2="140" y2="190"/><line x1="140" y1="190" x2="50" y2="190"/><text x="90" y="172" font-size="18">tube to hand input</text><rect x="275" y="274" width="220" height="62" fill="#e5f1ef"/><rect x="315" y="265" width="25" height="80" fill="#c6e2dd"/><rect x="440" y="265" width="25" height="80" fill="#c6e2dd"/><line x1="495" y1="305" x2="570" y2="305"/><line x1="570" y1="275" x2="570" y2="335"/><rect x="575" y="240" width="140" height="130" fill="#f8e7ba"/><text x="586" y="285" font-size="21">SLED</text><text x="585" y="314" font-size="18">2 × 2 in</text><text x="295" y="247" font-size="19">fixed barrel</text><text x="554" y="401" font-size="18">upright tab taped to thumb pad</text><line x1="715" y1="218" x2="715" y2="392" stroke-dasharray="8 6"/><line x1="770" y1="218" x2="770" y2="392" stroke-dasharray="8 6"/><text x="682" y="205" font-size="18">START</text><text x="771" y="205" font-size="18">DELIVERY</text><text x="707" y="428" font-size="20">20 mm</text><text x="282" y="363" font-size="18">Nozzle x = 3 in</text><text x="73" y="545" font-size="21">Axis y = 3 in. Saddles hold BARREL only; plunger and sled remain free.</text><text x="73" y="586" font-size="20">Sled blank: 3 × 2 in. Fold at 1 in → upright 1-in tab + 2 × 2-in deck.</text><text x="73" y="626" font-size="19">Day 4: three 1/2-in cargo fences. Day 7: two base-fixed rails, 1/8-in side gaps.</text><text x="28" y="676" font-size="18">NTS • Use written dimensions, not pixels or printed scale. Follow the numbered lesson.</text></svg>