<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img"><title>J1 · Door-open detector: actual mechanism and three connections</title><desc>Original classroom construction plan with labeled parts and finished views. Not to scale. Use written dimensions and numbered lesson steps.</desc><rect width="1000" height="700" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183c44;stroke:none}line,path,polygon,rect,circle{stroke:#28636a;stroke-width:2.2} </style><text x="28" y="38" font-size="27">J1 · Door-open detector: actual mechanism and three connections</text><text x="40" y="87" font-size="21">BENCH MODEL · TOP VIEW (door shut)</text><rect x="50" y="125" width="470" height="320" fill="white"/><line x1="50" y1="325" x2="238" y2="325"/><line x1="238" y1="325" x2="379" y2="325"/><circle cx="238" cy="325" r="4" fill="#185e65"/><text x="75" y="313" font-size="19">fixed wall</text><text x="255" y="313" font-size="19">door</text><text x="66" y="476" font-size="18">Base 10 × 8 in; front = bottom edge</text><polygon points="355,323 378,323 378,246 355,246" fill="#f8e7ba"/><rect x="350" y="151" width="33" height="115" fill="#d6bf9c"/><text x="396" y="181" font-size="17">handle</text><text x="395" y="255" font-size="17">foil jaws</text><line x1="388" y1="256" x2="371" y2="260"/><text x="90" y="180" font-size="18">BACK / increasing y</text><text x="85" y="403" font-size="19">Door swings toward FRONT ↓</text><text x="543" y="90" font-size="21">TONGUE SIDE DETAIL</text><line x1="590" y1="160" x2="590" y2="330"/><line x1="590" y1="330" x2="750" y2="330"/><text x="615" y="190" font-size="19">1-in leg taped</text><text x="615" y="220" font-size="19">to BACK of door</text><text x="608" y="361" font-size="18">2-in leg projects behind door</text><text x="545" y="423" font-size="20">Door opens toward front:</text><text x="545" y="453" font-size="19">tongue withdraws → foil touches</text><text x="545" y="483" font-size="19">→ lamp ON. Reset by hand.</text><text x="40" y="541" font-size="22">CONNECTIONS · holder OFF while wiring</text><text x="40" y="582" font-size="20">Supply + → foil jaw A     |     foil jaw B → lamp A     |     lamp B → supply −</text><text x="40" y="624" font-size="21">Shut door + inserted card: OFF. Open door + foil contact: ON.</text><text x="28" y="676" font-size="18">NTS • Use written dimensions, not pixels or printed scale. Follow the numbered lesson.</text></svg>