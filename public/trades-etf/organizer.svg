<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img"><title>B · Three-bay supply tray: assembly and part locations</title><desc>Original classroom construction plan with labeled parts and finished views. Not to scale. Use written dimensions and numbered lesson steps.</desc><rect width="1000" height="760" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183c44;stroke:none}line,path,polygon,rect,circle{stroke:#28636a;stroke-width:2.2} </style><text x="28" y="38" font-size="27">B · Three-bay supply tray: assembly and part locations</text><text x="35" y="83" font-size="21">ASSEMBLED TRAY · three open bays</text><g id="assembled-tray" stroke-linejoin="round"><g id="tray-base"><polygon points="90.00,318.12 530.00,318.12 530.00,315.00 90.00,315.00" fill="#bad8d5"/><polygon points="530.00,318.12 602.00,162.12 602.00,159.00 530.00,315.00" fill="#abcac7"/><polygon points="90.00,315.00 530.00,315.00 602.00,159.00 162.00,159.00" fill="#f5f9f8"/></g><g id="tray-rear"><polygon points="160.50,162.25 600.50,162.25 600.50,112.25 160.50,112.25" fill="#d8ece7"/><polygon points="600.50,162.25 602.00,159.00 602.00,109.00 600.50,112.25" fill="#aacdca"/><polygon points="160.50,112.25 600.50,112.25 602.00,109.00 162.00,109.00" fill="#eef7f5"/></g><g id="tray-E1"><polygon points="91.50,311.75 98.38,311.75 98.38,261.75 91.50,261.75" fill="#aacdca"/><polygon points="98.38,311.75 167.38,162.25 167.38,112.25 98.38,261.75" fill="#c4dfda"/><polygon points="91.50,261.75 98.38,261.75 167.38,112.25 160.50,112.25" fill="#eef7f5"/></g><text x="132.88" y="212.00" font-size="18" text-anchor="middle" font-weight="bold">E1</text><g id="tray-D1"><polygon points="235.88,311.75 242.75,311.75 242.75,261.75 235.88,261.75" fill="#c38f3c"/><polygon points="242.75,311.75 311.75,162.25 311.75,112.25 242.75,261.75" fill="#f2d496"/><polygon points="235.88,261.75 242.75,261.75 311.75,112.25 304.88,112.25" fill="#fff0ce"/></g><text x="277.25" y="212.00" font-size="18" text-anchor="middle" font-weight="bold">D1</text><g id="tray-D2"><polygon points="380.25,311.75 387.12,311.75 387.12,261.75 380.25,261.75" fill="#c38f3c"/><polygon points="387.12,311.75 456.12,162.25 456.12,112.25 387.12,261.75" fill="#f2d496"/><polygon points="380.25,261.75 387.12,261.75 456.12,112.25 449.25,112.25" fill="#fff0ce"/></g><text x="421.62" y="212.00" font-size="18" text-anchor="middle" font-weight="bold">D2</text><g id="tray-E2"><polygon points="524.62,311.75 531.50,311.75 531.50,261.75 524.62,261.75" fill="#aacdca"/><polygon points="531.50,311.75 600.50,162.25 600.50,112.25 531.50,261.75" fill="#c4dfda"/><polygon points="524.62,261.75 531.50,261.75 600.50,112.25 593.62,112.25" fill="#eef7f5"/></g><text x="566.00" y="212.00" font-size="18" text-anchor="middle" font-weight="bold">E2</text><text x="199.22" y="242.20" font-size="16" text-anchor="middle" font-weight="bold">Bay 1</text><text x="343.60" y="242.20" font-size="16" text-anchor="middle" font-weight="bold">Bay 2</text><text x="487.98" y="242.20" font-size="16" text-anchor="middle" font-weight="bold">Bay 3</text><text x="380.50" y="137.25" font-size="18" text-anchor="middle" font-weight="bold">R · rear wall</text><g id="tray-front"><polygon points="90.00,315.00 530.00,315.00 530.00,265.00 90.00,265.00" fill="#b7d9d3"/><polygon points="530.00,315.00 531.50,311.75 531.50,261.75 530.00,265.00" fill="#9bbfba"/><polygon points="90.00,265.00 530.00,265.00 531.50,261.75 91.50,261.75" fill="#e8f4f1"/></g><text x="310.00" y="293.75" font-size="17" text-anchor="middle" font-weight="bold">F · one continuous front wall</text></g><line x1="450" y1="319" x2="476" y2="340"/><text x="482" y="346" font-size="17">B · base</text><text x="655" y="125" font-size="20">PARTS ON THE TRAY</text><text x="655" y="160" font-size="18">F / R = front / rear walls</text><text x="655" y="192" font-size="18">E1 / E2 = left / right ends</text><text x="655" y="224" font-size="18">D1 / D2 = two dividers</text><text x="655" y="256" font-size="18">B = one base under all bays</text><text x="655" y="303" font-size="18">All walls: 2 in high above B.</text><text x="35" y="365" font-size="21">TOP VIEW · positions from the left outside edge A</text><rect x="80" y="400" width="440" height="200" fill="white"/><rect x="80" y="400" width="440" height="7" fill="#e5f1ef"/><rect x="80" y="593" width="440" height="7" fill="#e5f1ef"/><rect x="80" y="407" width="7" height="186" fill="#e5f1ef"/><rect x="513" y="407" width="7" height="186" fill="#e5f1ef"/><rect x="224" y="407" width="7" height="186" fill="#e5f1ef"/><text x="211" y="627" font-size="18">D1</text><rect x="369" y="407" width="7" height="186" fill="#e5f1ef"/><text x="356" y="627" font-size="18">D2</text><text x="83" y="627" font-size="18">A / 0</text><text x="535" y="512" font-size="20">6 in</text><text x="228" y="387" font-size="20">8 in overall</text><text x="600" y="390" font-size="21">CUT LIST · 7 parts</text><text x="600" y="428" font-size="18">B: 1 × (8 × 6 in)</text><text x="600" y="460" font-size="18">F/R: 2 × (8 × 2 in)</text><text x="600" y="492" font-size="18">E/D: 4 × (6 × 2-in blanks)</text><text x="600" y="524" font-size="18">Fit E/D between F and R.</text><text x="600" y="556" font-size="18">At 1/8-in stock: fitted length 5 3/4 in.</text><text x="600" y="588" font-size="18">Use actual gap for your stock.</text><text x="40" y="671" font-size="18">D1 left face x = 2 5/8 in; D2 left face x = 5 1/4 in. All walls sit on top of B.</text><text x="40" y="701" font-size="18">At 1/8-in stock, each clear bay is 2 1/2 in. Measure actual clearance for thinner stock.</text><text x="28" y="736" font-size="18">NTS • Use written dimensions, not pixels or printed scale. Follow the numbered lesson.</text></svg>