<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img"><title>D · Paper tower: 11-in columns, capped load, base ties</title><desc>Original classroom construction plan with labeled parts and finished views. Not to scale. Use written dimensions and numbered lesson steps.</desc><rect width="1000" height="700" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183c44;stroke:none}line,path,polygon,rect,circle{stroke:#28636a;stroke-width:2.2} </style><text x="28" y="38" font-size="27">D · Paper tower: 11-in columns, capped load, base ties</text><text x="35" y="86" font-size="21">TWO TRIANGULAR COLUMNS</text><rect x="50" y="125" width="325" height="275" fill="#e5f1ef"/><line x1="150" y1="125" x2="150" y2="400" stroke-dasharray="8 6"/><line x1="250" y1="125" x2="250" y2="400" stroke-dasharray="8 6"/><line x1="350" y1="125" x2="350" y2="400" stroke-dasharray="8 6"/><text x="70" y="222" font-size="18">2 in</text><text x="167" y="222" font-size="18">2 in</text><text x="267" y="222" font-size="18">2 in</text><text x="398" y="260" font-size="21">11 in</text><text x="55" y="438" font-size="19">Blank: 6 1/2 × 11 in; tab = 1/2 in</text><polygon points="580,400 630,380 680,400 680,155 630,135 580,155" fill="#e5f1ef"/><polygon points="790,400 840,380 890,400 890,155 840,135 790,155" fill="#e5f1ef"/><polygon points="550,155 865,155 925,113 610,113" fill="#c6e2dd"/><rect x="700" y="73" width="60" height="47" fill="#f8e7ba"/><text x="675" y="62" font-size="19">cup + clips</text><text x="570" y="445" font-size="21">6 × 6-in platform</text><text x="50" y="507" font-size="22">1. Fold/tape two columns; level both ends.</text><text x="50" y="546" font-size="20">2. Place cup centrally. Add 1 clip every 5 s; stop at 10 or instability.</text><text x="50" y="585" font-size="20">3. Add two 6 × 1-in ties between column bases (front and rear).</text><text x="50" y="624" font-size="20">4. Retest with the same load. Do not tape the tower to the table.</text><text x="28" y="676" font-size="18">NTS • Use written dimensions, not pixels or printed scale. Follow the numbered lesson.</text></svg>