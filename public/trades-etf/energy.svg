<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img"><title>K · Power, time and energy are different quantities</title><desc>Original dimensioned classroom drawing. Not to scale; use written dimensions and the accompanying lesson.</desc><rect width="800" height="480" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#193940;stroke:none}line,rect,path,circle{stroke:#24525a;stroke-width:2}</style><text x="30" y="35" font-size="23" text-anchor="start">K · Power, time and energy are different quantities</text><rect x="45" y="155" width="200" height="155" fill="#edf5f4"/><text x="145" y="200" font-size="23" text-anchor="middle">POWER</text><text x="145" y="245" font-size="19" text-anchor="middle">volts × amps</text><rect x="300" y="155" width="200" height="155" fill="#edf5f4"/><text x="400" y="200" font-size="23" text-anchor="middle">TIME</text><text x="400" y="245" font-size="19" text-anchor="middle">hours</text><rect x="555" y="155" width="200" height="155" fill="#edf5f4"/><text x="655" y="200" font-size="23" text-anchor="middle">ENERGY</text><text x="655" y="245" font-size="19" text-anchor="middle">watt-hours</text><text x="270" y="240" font-size="28" text-anchor="middle">×</text><text x="525" y="240" font-size="28" text-anchor="middle">=</text><text x="400" y="368" font-size="23" text-anchor="middle">1,000 Wh = 1 kWh</text><text x="30" y="452" font-size="17" text-anchor="start">NTS • Use written dimensions. Sizes are classroom examples.</text></svg>