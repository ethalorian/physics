<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img"><title>E2 · Racking frame: dimensions, restraint and load point</title><desc>Original classroom construction plan with labeled parts and finished views. Not to scale. Use written dimensions and numbered lesson steps.</desc><rect width="1000" height="700" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183c44;stroke:none}line,path,polygon,rect,circle{stroke:#28636a;stroke-width:2.2} </style><text x="28" y="38" font-size="27">E2 · Racking frame: dimensions, restraint and load point</text><text x="40" y="86" font-size="20">JOINT-CENTER PLAN · strip ends extend 1/2 in beyond each dot</text><rect x="155" y="153" width="450" height="22" fill="#e5f1ef"/><rect x="155" y="488" width="450" height="22" fill="#e5f1ef"/><rect x="168" y="140" width="22" height="385" fill="#e5f1ef"/><rect x="568" y="140" width="22" height="385" fill="#e5f1ef"/><line x1="180" y1="499" x2="580" y2="164" stroke-dasharray="8 6"/><circle cx="180" cy="164" r="4" fill="#185e65"/><circle cx="180" cy="499" r="4" fill="#185e65"/><circle cx="580" cy="164" r="4" fill="#185e65"/><circle cx="580" cy="499" r="4" fill="#185e65"/><text x="310" y="130" font-size="23">8 in</text><text x="85" y="330" font-size="23">6 in</text><text x="375" y="354" font-size="22">10-in diagonal</text><text x="655" y="207" font-size="21">Fix left upright</text><text x="655" y="239" font-size="19">between stable books.</text><line x1="580" y1="164" x2="660" y2="245"/><rect x="635" y="245" width="50" height="60" fill="#f8e7ba"/><text x="685" y="293" font-size="20">Cup + 10 clips</text><text x="655" y="358" font-size="19">Measure downward</text><text x="655" y="388" font-size="19">movement of the</text><text x="655" y="418" font-size="19">top-right joint.</text><text x="40" y="565" font-size="21">Parts: two 9 × 1-in strips; two 7 × 1-in strips; one 11 × 1-in brace.</text><text x="40" y="610" font-size="20">Test once unbraced, then add diagonal and repeat with the identical load.</text><text x="28" y="676" font-size="18">NTS • Use written dimensions, not pixels or printed scale. Follow the numbered lesson.</text></svg>