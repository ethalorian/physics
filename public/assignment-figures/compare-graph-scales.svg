"grid" x1="510" y1="70" x2="510" y2="270"/><line class="grid" x1="410" y1="170" x2="610" y2="170"/><text x="505" y="295">4</text><text x="382" y="177">2</text><line class="grid" x1="560" y1="70" x2="560" y2="270"/><line class="grid" x1="410" y1="120" x2="610" y2="120"/><text x="555" y="295">6</text><text x="382" y="127">3</text><line class="grid" x1="610" y1="70" x2="610" y2="270"/><line class="grid" x1="410" y1="70" x2="610" y2="70"/><text x="605" y="295">8</text><text x="382" y="77">4</text><path d="M410 65V270H625"/><path d="M410 270L610 70"/><text x="470" y="330">Time (s)</text><text x="366" y="210" transform="rotate(-90 366 210)">Position (m)</text></svg>