<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">Boat crossing a flowing river</title><rect width="720" height="360" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#222"/></marker></defs><style>text{font:20px sans-serif;fill:#222}path,line,polyline,circle,rect.shape{stroke:#222;stroke-width:3;fill:none}.arrow{marker-end:url(#arrow)}.grid{stroke:#ddd;stroke-width:1}</style><path d="M40 50H680M40 310H680"/><text x="45" y="35">Opposite shore</text><text x="45" y="340">Starting shore</text><path d="M170 275V105" class="arrow"/><text x="195" y="180">Boat: 8 km/h across the water</text><path d="M400 250H620" class="arrow"/><text x="360" y="290">River flow: 6 km/h</text><ellipse cx="170" cy="280" rx="15" ry="25" fill="#ddd" stroke="#222" stroke-width="3"/></svg>