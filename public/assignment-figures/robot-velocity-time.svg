<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">Robot velocity versus time</title><rect width="720" height="360" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#222"/></marker></defs><style>text{font:20px sans-serif;fill:#222}path,line,polyline,circle,rect.shape{stroke:#222;stroke-width:3;fill:none}.arrow{marker-end:url(#arrow)}.grid{stroke:#ddd;stroke-width:1}</style><path d="M75 40V285H655M75 190H655"/><text x="305" y="345">Time (s)</text><text x="25" y="240" transform="rotate(-90 25 240)">Velocity (m/s)</text><line class="grid" x1="75" y1="40" x2="75" y2="285"/><text x="70" y="310">0</text><line class="grid" x1="185" y1="40" x2="185" y2="285"/><text x="180" y="310">1</text><line class="grid" x1="295" y1="40" x2="295" y2="285"/><text x="290" y="310">2</text><line class="grid" x1="405" y1="40" x2="405" y2="285"/><text x="400" y="310">3</text><line class="grid" x1="515" y1="40" x2="515" y2="285"/><text x="510" y="310">4</text><line class="grid" x1="625" y1="40" x2="625" y2="285"/><text x="620" y="310">5</text><line class="grid" x1="75" y1="270" x2="655" y2="270"/><text x="45" y="276">-2</text><line class="grid" x1="75" y1="230" x2="655" y2="230"/><text x="45" y="236">-1</text><line class="grid" x1="75" y1="190" x2="655" y2="190"/><text x="45" y="196">0</text><line class="grid" x1="75" y1="150" x2="655" y2="150"/><text x="45" y="156">1</text><line class="grid" x1="75" y1="110" x2="655" y2="110"/><text x="45" y="116">2</text><line class="grid" x1="75" y1="70" x2="655" y2="70"/><text x="45" y="76">3</text><path d="M75 70H295M295 270H625" stroke-width="5"/><path d="M295 70V270" stroke-dasharray="5 5"/></svg>