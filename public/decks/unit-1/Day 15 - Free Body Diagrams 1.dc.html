document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 font-size:24px; letter-spacing:0.28em; color:#8B87A6;\">CPA PHYSICS · HONORS · THE VISUAL LANGUAGE OF FORCE<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"position:absolute; left:130px; top:300px; width:1040px; display:flex; flex-direction:column; gap:44px; align-items:flex-start;\">\n    <h1 style=\"margin:0; font-family:'Space Grotesk',sans-serif; font-size:94px; line-height:1.05; letter-spacing:-0.02em; color:#17142E; font-weight:700;\">Free Body<br>Diagrams, <span style=\"color:#E0A93D;\">Part 1<\u002Fspan><\u002Fh1>\n    <p style=\"margin:0; font-size:38px; line-height:1.45; color:#6E6A8C; max-width:900px;\">Day 15: one dot, one arrow per force — and defending what's NOT there.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"position:absolute; left:130px; right:130px; bottom:60px; border-top:1px solid #E5E2F0; padding-top:24px; display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:24px; color:#8B87A6;\">\n    <span>UNIT 01 · DAY 15 · PHASE 2<\u002Fspan>\n    <span style=\"color:#C08F2E;\">TARGET: ASTEROID 2026-XJ<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Do Now\" data-speaker-notes=\"Warm-up 0–5 min: surfaces what students think the forces are (watch for “force of the desk?”) and motivates FBDs as the representation. Their invented drawings become the hook for the six rules.\" style=\"position:relative; box-sizing:border-box; background:#F1EEF9; font-family:'Atkinson Hyperlegible',Verdana,sans-serif; color:#3A3654; padding:130px 130px 150px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center;\">\n  <div style=\"display:flex; align-items:center; gap:18px; margin-bottom:60px;\">\n    <span style=\"width:12px; height:12px; background:#7FA68B; display:inline-block;\"><\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.28em; color:#5E8B6E;\">DO NOW · 5 MIN<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 48px 0; font-family:'Space Grotesk',sans-serif; font-size:64px; line-height:1.22; letter-spacing:-0.01em; color:#17142E; max-width:1560px; font-weight:600; text-wrap:balance;\">List every force acting on a book resting on a desk.<br>Then invent a way to <em>draw<\u002Fem> them.<\u002Fp>\n  <p style=\"margin:0; font-family:'IBM Plex Mono',monospace; font-size:26px; letter-spacing:0.08em; color:#7A75A0;\">Your drawing IS today’s topic.<\u002Fp>\n  <div style=\"position:absolute; left:130px; right:130px; bottom:60px; border-top:1px solid #D9D3EA; padding-top:24px; display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:24px; color:#8B87A6;\">\n    <span>→ PACKET · DAY 15 — DO NOW<\u002Fspan>\n    <span>U1 · 02/09<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section data-label=\"Today's Target\" data-speaker-notes=\"TEACHER CHECK: target matches the packet — all forces, proportional arrows, justify inclusions AND exclusions.\" style=\"position:relative; box-sizing:border-box; background:#FAF9FC; font-family:'Atkinson Hyperlegible',Verdana,sans-serif; color:#3A3654; padding:130px 130px 150px; display:flex; flex-direction:column; align-items:flex-start;\">\n  <div style=\"position:absolute; right:90px; top:40px; font-family:'Space Grotesk',sans-serif; font-size:320px; font-weight:700; color:rgba(155,142,196,0.10); line-height:1;\">02<\u002Fdiv>\n  <div style=\"display:flex; align-items:center; gap:18px; margin-bottom:70px;\">\n    <span style=\"width:12px; height:12px; background:#E0A93D; display:inline-block;\"><\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.28em; color:#8B87A6;\">TODAY'S TARGET<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-family:'Space Grotesk',sans-serif; font-size:58px; line-height:1.32; letter-spacing:-0.01em; color:#17142E; max-width:1520px; font-weight:600; text-wrap:balance;\">I can draw a free body diagram with all forces and proportional arrows — and justify why each force belongs <span style=\"color:#E0A93D;\">(and why excluded ones don't)<\u002Fspan>.<\u002Fp>\n  <div style=\"position:absolute; left:130px; right:130px; bottom:60px; border-top:1px solid #E5E2F0; padding-top:24px; display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:24px; color:#8B87A6;\">\n    <span>→ PACKET · DAY 15 — TODAY'S TARGET<\u002Fspan>\n    <span>U1 · 03/09<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The Six Rules\" data-speaker-notes=\"Model 3–4 FBDs on the board: book on desk; person standing; box being pushed. ELL: force-label reference strip (F_g, F_N, F_f, F_T, F_app) taped to each whiteboard.\" style=\"position:relative; box-sizing:border-box; background:#FAF9FC; font-family:'Atkinson Hyperlegible',Verdana,sans-serif; color:#3A3654; padding:100px 130px 150px; display:flex; flex-direction:column; align-items:flex-start;\">\n  <div style=\"display:flex; align-items:center; gap:18px; margin-bottom:40px;\">\n    <span style=\"width:12px; height:12px; background:#9B8EC4; display:inline-block;\"><\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.28em; color:#8B87A6;\">THE RULES<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"margin:0 0 56px 0; font-family:'Space Grotesk',sans-serif; font-size:64px; line-height:1.08; letter-spacing:-0.015em; color:#17142E; font-weight:700;\">Six Rules, Every Diagram<\u002Fh2>\n  <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:28px 60px; width:100%;\">\n    <div style=\"display:flex; gap:26px; align-items:baseline; border-top:4px solid #E5E2F0; padding-top:20px;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-size:38px; font-weight:700; color:#9B8EC4;\">01<\u002Fspan><span style=\"font-size:31px; line-height:1.45;\">Just the object — reduce it to a <strong>dot<\u002Fstrong>.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:26px; align-items:baseline; border-top:4px solid #E5E2F0; padding-top:20px;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-size:38px; font-weight:700; color:#9B8EC4;\">02<\u002Fspan><span style=\"font-size:31px; line-height:1.45;\">One arrow per force <strong>ON<\u002Fstrong> the object.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:26px; align-items:baseline; border-top:4px solid #E5E2F0; padding-top:20px;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-size:38px; font-weight:700; color:#9B8EC4;\">03<\u002Fspan><span style=\"font-size:31px; line-height:1.45;\">Arrows point in the force's <strong>direction<\u002Fstrong>.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:26px; align-items:baseline; border-top:4px solid #E5E2F0; padding-top:20px;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-size:38px; font-weight:700; color:#9B8EC4;\">04<\u002Fspan><span style=\"font-size:31px; line-height:1.45;\">Length <strong>proportional<\u002Fstrong> to magnitude.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:26px; align-items:baseline; border-top:4px solid #E5E2F0; padding-top:20px;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-size:38px; font-weight:700; color:#9B8EC4;\">05<\u002Fspan><span style=\"font-size:31px; line-height:1.45;\">Label each: <span style=\"font-family:'IBM Plex Mono',monospace;\">F_g · F_N · F_f · F_T · F_app<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:26px; align-items:baseline; border-top:4px solid #E0A93D; padding-top:20px;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-size:38px; font-weight:700; color:#C08F2E;\">06<\u002Fspan><span style=\"font-size:31px; line-height:1.45;\"><strong>ONLY forces on the object<\u002Fstrong> — nothing it exerts on other things.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute; left:130px; right:130px; bottom:60px; border-top:1px solid #E5E2F0; padding-top:24px; display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:24px; color:#8B87A6;\">\n    <span>→ PACKET · DAY 15 — FBD RULES<\u002Fspan>\n    <span>U1 · 04/09<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Whiteboard Rounds\" data-speaker-notes=\"Scenarios released one at a time: book on table; box on rough floor; person walking; car on a curve; ball at the peak (only gravity!). Whole-class check after each. HONORS: for each, defend why a tempting extra arrow ('force of motion') is NOT there. Common errors: missing normal force, adding momentum/inertia as forces.\" style=\"position:relative; box-sizing:border-box; background:#FAF9FC; font-family:'Atkinson Hyperlegible',Verdana,sans-serif; color:#3A3654; padding:110px 130px 150px; display:flex; flex-direction:column; align-items:flex-start;\">\n  <div style=\"display:flex; align-items:center; gap:18px; margin-bottom:44px;\">\n    <span style=\"width:12px; height:12px; background:#7FA68B; display:inline-block;\"><\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.28em; color:#8B87A6;\">WHITEBOARDS · ONE SCENARIO AT A TIME<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"margin:0 0 60px 0; font-family:'Space Grotesk',sans-serif; font-size:70px; line-height:1.08; letter-spacing:-0.015em; color:#17142E; font-weight:700;\">Draw. Check. Defend.<\u002Fh2>\n  <div style=\"display:flex; gap:30px; flex-wrap:wrap; margin-bottom:56px;\">\n    <div style=\"background:#FFFFFF; border:2px solid #E5E2F0; border-radius:6px; padding:26px 38px; font-size:30px; font-weight:700; color:#17142E;\">Book on a table<\u002Fdiv>\n    <div style=\"background:#FFFFFF; border:2px solid #E5E2F0; border-radius:6px; padding:26px 38px; font-size:30px; font-weight:700; color:#17142E;\">Box on a rough floor<\u002Fdiv>\n    <div style=\"background:#FFFFFF; border:2px solid #E5E2F0; border-radius:6px; padding:26px 38px; font-size:30px; font-weight:700; color:#17142E;\">Person walking<\u002Fdiv>\n    <div style=\"background:#FFFFFF; border:2px solid #E5E2F0; border-radius:6px; padding:26px 38px; font-size:30px; font-weight:700; color:#17142E;\">Car on a curve<\u002Fdiv>\n    <div style=\"background:#FFFFFF; border:2px solid #E0A93D; border-radius:6px; padding:26px 38px; font-size:30px; font-weight:700; color:#17142E;\">Ball at its peak — only gravity<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:34px; line-height:1.55; color:#17142E; background:#F1EEF9; border-radius:6px; padding:30px 38px; max-width:1460px;\"><strong>Honors, every round:<\u002Fstrong> defend why the tempting extra arrow — the \"force of motion\" — is <strong>not there<\u002Fstrong>. Knowing what's absent is the hardest FBD skill.<\u002Fp>\n  <div style=\"position:absolute; left:130px; right:130px; bottom:60px; border-top:1px solid #E5E2F0; padding-top:24px; display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:24px; color:#8B87A6;\">\n    <span>→ PACKET · DAY 15 — FBD SCENARIOS<\u002Fspan>\n    <span>U1 · 05/09<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"FBD Builder — Live Sim\" data-speaker-notes=\"Toggle-based FBD builder: pick a scenario, toggle force arrows on the dot (including the red trap chips), press CHECK. Feedback names what's missing and what doesn't belong — inclusions AND exclusions, the day's honors skill.\" style=\"position:relative; box-sizing:border-box; background:#FAF9FC; font-family:'Atkinson Hyperlegible',Verdana,sans-serif; color:#3A3654; padding:80px 130px 150px; display:flex; flex-direction:column; align-items:flex-start;\">\n  <div style=\"display:flex; justify-content:space-between; align-items:baseline; width:100%; margin-bottom:18px;\">\n    <h2 style=\"margin:0; font-family:'Space Grotesk',sans-serif; font-size:58px; line-height:1.06; letter-spacing:-0.015em; color:#17142E; font-weight:700;\">Build the Diagram — Then Defend It<\u002Fh2>\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.24em; color:#8B87A6;\">SIM 10 · FBD BUILDER<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 26px 0; font-size:28px; line-height:1.45; max-width:1560px;\">Toggle arrows onto the dot, then <strong style=\"color:#17142E;\">CHECK<\u002Fstrong>. Try the ball at its peak — one arrow only. The red chips are traps.<\u002Fp>\n  <div style=\"width:100%;\">\n    <x-import component=\"FBDBuilderSim\" from=\"5e93ea88-5f51-43fb-b79a-21cb82860861#/sims2.jsx\" scenario=\"box\" hint-size=\"100%,500px\"><\u002Fx-import>\n  <\u002Fdiv>\n  <div style=\"position:absolute; left:130px; right:130px; bottom:60px; border-top:1px solid #E5E2F0; padding-top:24px; display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:24px; color:#8B87A6;\">\n    <span>→ PACKET · DAY 15 — FBD SCENARIOS<\u002Fspan>\n    <span>U1 · 06/09<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The Asteroid's FBD\" data-speaker-notes=\"Extension: draw the FBD for 2026-XJ in deep space and justify why there's no normal force or friction. Gravity toward Sun (dominant), gravity toward Earth (weaker), other bodies negligible; add an applied force only if an impactor hits.\" style=\"position:relative; box-sizing:border-box; overflow:hidden; background-color:#14112A; background-image:radial-gradient(2px 2px at 11% 19%, rgba(224,169,61,.9) 50%, transparent 52%), radial-gradient(1.5px 1.5px at 24% 71%, rgba(255,255,255,.5) 50%, transparent 52%), radial-gradient(2px 2px at 33% 34%, rgba(255,255,255,.35) 50%, transparent 52%), radial-gradient(1.5px 1.5px at 52% 15%, rgba(255,255,255,.45) 50%, transparent 52%), radial-gradient(2.5px 2.5px at 72% 25%, rgba(224,169,61,.85) 50%, transparent 52%), radial-gradient(2px 2px at 90% 41%, rgba(255,255,255,.4) 50%, transparent 52%), radial-gradient(2px 2px at 17% 88%, rgba(255,255,255,.35) 50%, transparent 52%); font-family:'Atkinson Hyperlegible',Verdana,sans-serif; padding:100px 130px 150px; display:grid; grid-template-columns:1fr 560px; gap:90px; align-items:center;\">\n  <div style=\"display:flex; flex-direction:column; align-items:flex-start;\">\n    <div style=\"display:flex; align-items:center; gap:18px; margin-bottom:48px;\">\n      <span style=\"width:12px; height:12px; background:#E0A93D; display:inline-block;\"><\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.28em; color:#9B8EC4;\">ASTEROID THREAD<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"margin:0 0 52px 0; font-family:'Space Grotesk',sans-serif; font-size:70px; line-height:1.06; letter-spacing:-0.015em; color:#FAF9FC; font-weight:700;\">The Cleanest FBD<br>You'll Ever Draw<\u002Fh2>\n    <p style=\"margin:0; font-size:36px; line-height:1.6; color:#D9D6E8; max-width:900px;\">In deep space: solar gravity (dominant), Earth's gravity (weaker). No normal force — nothing touches it. No friction — nothing to rub. <strong style=\"color:#E0A93D;\">Justify each absence.<\u002Fstrong><\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:rgba(30,26,56,0.7); border:1px solid rgba(155,142,196,0.35); border-radius:8px; padding:36px 30px 24px;\">\n    <svg viewBox=\"0 0 440 400\" style=\"width:100%; display:block;\">\n      <circle cx=\"220\" cy=\"190\" r=\"22\" fill=\"#FAF9FC\"><\u002Fcircle>\n      <line x1=\"220\" y1=\"220\" x2=\"220\" y2=\"340\" stroke=\"#E0A93D\" stroke-width=\"8\"><\u002Fline>\n      <path d=\"M 220 358 l -13 -26 l 26 0 z\" fill=\"#E0A93D\"><\u002Fpath>\n      <text x=\"244\" y=\"320\" font-family=\"IBM Plex Mono, monospace\" font-size=\"21\" fill=\"#E0A93D\">F_g sun<\u002Ftext>\n      <line x1=\"248\" y1=\"176\" x2=\"330\" y2=\"136\" stroke=\"#7FA68B\" stroke-width=\"5\"><\u002Fline>\n      <path d=\"M 346 128 l -26 2 l 10 20 z\" fill=\"#7FA68B\"><\u002Fpath>\n      <text x=\"290\" y=\"110\" font-family=\"IBM Plex Mono, monospace\" font-size=\"21\" fill=\"#7FA68B\">F_g earth<\u002Ftext>\n      <text x=\"220\" y=\"388\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"18\" fill=\"#8B87A6\" letter-spacing=\"3\">FIG. 01 — 2026-XJ, DEEP SPACE<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Fdiv>\n  <div style=\"position:absolute; left:130px; right:130px; bottom:64px; border-top:1px solid rgba(155,142,196,0.3); padding-top:26px; display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:24px; color:#7A75A0;\">\n    <span>→ PACKET · DAY 15 — ASTEROID FBD<\u002Fspan>\n    <span>U1 · 07/09<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Anti-Examples\" data-speaker-notes=\"Show the prepared anti-example slides: missing normal force; wrong applied-force direction; forces the object exerts on OTHERS; a 'momentum' arrow. Have students spot the error before you name it.\" style=\"position:relative; box-sizing:border-box; background:#F1EEF9; font-family:'Atkinson Hyperlegible',Verdana,sans-serif; color:#3A3654; padding:120px 130px 150px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center;\">\n  <div style=\"display:flex; align-items:center; gap:18px; margin-bottom:44px;\">\n    <span style=\"width:12px; height:12px; background:#E0A93D; display:inline-block;\"><\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.28em; color:#7A75A0;\">ANTI-EXAMPLES — SPOT THE ERROR<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"margin:0 0 60px 0; font-family:'Space Grotesk',sans-serif; font-size:74px; line-height:1.06; letter-spacing:-0.015em; color:#17142E; font-weight:700;\">Four Broken Diagrams<\u002Fh2>\n  <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:32px 44px; width:100%;\">\n    <div style=\"display:flex; gap:24px; align-items:baseline; border-top:4px solid #D9D3EA; padding-top:22px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; color:#C08F2E;\">✕<\u002Fspan><span style=\"font-size:34px; line-height:1.45;\">The <strong>normal force is missing<\u002Fstrong> — the book falls through the desk.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:24px; align-items:baseline; border-top:4px solid #D9D3EA; padding-top:22px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; color:#C08F2E;\">✕<\u002Fspan><span style=\"font-size:34px; line-height:1.45;\">Applied force points the <strong>wrong way<\u002Fstrong>.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:24px; align-items:baseline; border-top:4px solid #D9D3EA; padding-top:22px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; color:#C08F2E;\">✕<\u002Fspan><span style=\"font-size:34px; line-height:1.45;\">Includes forces the object exerts <strong>on other things<\u002Fstrong>.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:24px; align-items:baseline; border-top:4px solid #D9D3EA; padding-top:22px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; color:#C08F2E;\">✕<\u002Fspan><span style=\"font-size:34px; line-height:1.45;\">A \"<strong>momentum<\u002Fstrong>\" arrow — Day 10 says no.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute; left:130px; right:130px; bottom:60px; border-top:1px solid #D9D3EA; padding-top:24px; display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:24px; color:#8B87A6;\">\n    <span>→ PACKET · DAY 15 — ANTI-EXAMPLES<\u002Fspan>\n    <span>U1 · 08/09<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Exit Ticket · Rate Yourself\" data-speaker-notes=\"Exit: FBD for a box PULLED across a floor by a rope, friction resisting — F_g, F_N, F_T, F_f. TEACHER CHECK: matches the packet's Day 15 Exit Ticket.\" style=\"position:relative; box-sizing:border-box; background:#FAF9FC; font-family:'Atkinson Hyperlegible',Verdana,sans-serif; color:#3A3654; padding:110px 130px 150px; display:flex; flex-direction:column; align-items:flex-start;\">\n  <div style=\"display:flex; align-items:center; gap:18px; margin-bottom:44px;\">\n    <span style=\"width:12px; height:12px; background:#7FA68B; display:inline-block;\"><\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.28em; color:#8B87A6;\">WRAP<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"margin:0 0 64px 0; font-family:'Space Grotesk',sans-serif; font-size:70px; line-height:1.08; letter-spacing:-0.015em; color:#17142E; font-weight:700;\">Exit Ticket · Rate Yourself<\u002Fh2>\n  <div style=\"display:grid; grid-template-columns:1.2fr 1fr; gap:40px; width:100%;\">\n    <div style=\"background:#FFFFFF; border:1px solid #E5E2F0; border-top:6px solid #9B8EC4; box-shadow:0 20px 50px -34px rgba(23,20,46,0.3); border-radius:6px; padding:48px 52px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.24em; color:#9B8EC4; margin-bottom:24px;\">EXIT TICKET<\u002Fdiv>\n      <p style=\"margin:0; font-size:34px; line-height:1.5; color:#17142E;\">Draw the FBD for a box pulled across a floor by a rope, with friction resisting. Labeled, proportional arrows.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF; border:1px solid #E5E2F0; border-top:6px solid #7FA68B; box-shadow:0 20px 50px -34px rgba(23,20,46,0.3); border-radius:6px; padding:48px 52px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.24em; color:#7FA68B; margin-bottom:24px;\">RATE YOURSELF<\u002Fdiv>\n      <div style=\"display:flex; gap:34px; margin-bottom:26px; font-family:'Space Grotesk',sans-serif; font-weight:700; align-items:baseline;\">\n        <span style=\"font-size:44px; color:#9B8EC4;\">1<\u002Fspan>\n        <span style=\"font-size:44px; color:#C08F2E;\">2<\u002Fspan>\n        <span style=\"font-size:44px; color:#7FA68B;\">3<\u002Fspan>\n        <span style=\"font-family:'Atkinson Hyperlegible',Verdana,sans-serif; font-size:26px; font-weight:400; color:#3A3654;\">Not Yet · Almost · Got It<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0; font-size:30px; line-height:1.5;\">Mark each Day 15 target in your packet.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n    <div style=\"margin-top:44px; width:100%; box-sizing:border-box; background:#17142E; border-radius:6px; padding:30px 44px; display:flex; gap:36px; align-items:baseline;\">\n    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.24em; color:#E0A93D; flex:none;\">TONIGHT<\u002Fspan>\n    <span style=\"font-size:30px; line-height:1.5; color:#FAF9FC;\">Hewitt Ch. 5 — free-body-diagram sections (or the teacher-provided notes if your edition lacks them).<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"position:absolute; left:130px; right:130px; bottom:60px; border-top:1px solid #E5E2F0; padding-top:24px; display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:24px; color:#8B87A6;\">\n    <span>→ PACKET · DAY 15 — EXIT TICKET AND RATE YOURSELF<\u002Fspan>\n    <span>U1 · 09/09<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
