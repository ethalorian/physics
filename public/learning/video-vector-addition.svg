<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Tip-to-tail vector addition"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="720" height="400" rx="18" fill="#f7f6ff"/><g font-family="Arial,sans-serif" fill="#25243d"><text x="32" y="42" font-size="25" font-weight="700">Follow the route. Draw the resultant.</text><g fill="none" stroke-width="4" marker-end="url(#a)"><path d="M85 310H250" stroke="#395cab"/><path d="M250 310V90" stroke="#395cab"/><path d="M85 310L250 90" stroke="#8055a4"/></g><g font-size="21"><text x="133" y="345">3 m east</text><text x="270" y="205">4 m north</text><text x="82" y="173">5 m</text><text x="425" y="133">Keep each arrow’s</text><text x="425" y="165">length and direction.</text><text x="425" y="237">R: first tail → last tip</text><text x="425" y="278">Distance = 7 m</text><text x="32" y="383">Use the same scale for every vector.</text></g></g></svg>
