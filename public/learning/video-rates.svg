<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title"><title id="title">Out-and-back motion: compare the path with the change in position</title><rect width="720" height="300" rx="16" fill="#f7f6fb"/><g stroke-width="4" fill="none"><path d="M90 70H610l-16-10m16 10l-16 10" stroke="#5651b4"/><path d="M610 112H90l16-10m-16 10l16 10" stroke="#407e60"/></g><g fill="#292840" font-family="sans-serif" font-size="20"><text x="60" y="48">start / finish</text><text x="548" y="48">turn around</text><text x="240" y="162">The path includes both legs.</text><text x="70" y="220">Average velocity = displacement / elapsed time</text><text x="70" y="260">Average speed = total distance / elapsed time</text></g></svg>
