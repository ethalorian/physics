<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Unit cancellation reference"><rect width="720" height="380" rx="18" fill="#f7f6ff"/><g fill="#25243d" font-family="Arial,sans-serif"><text x="36" y="44" font-size="25" font-weight="700">Keep the quantity. Change the unit.</text><g font-size="34"><text x="56" y="165">2 km ×</text><text x="251" y="140">1 000 m</text><path d="M 236 155 H 390" stroke="#25243d" stroke-width="2"/><text x="276" y="196">1 km</text><text x="422" y="165">= 2 000 m</text></g><path d="M 82 176 L 150 135 M 292 205 L 340 168" stroke="#bd6048" stroke-width="3"/><text x="57" y="274" font-size="23">Matching km units cancel; meters remain.</text><text x="57" y="321" font-size="20">The factor 1 000 m / 1 km equals one.</text></g></svg>