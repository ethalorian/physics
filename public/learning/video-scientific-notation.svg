<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Scientific notation reference"><rect width="720" height="380" rx="18" fill="#f7f6ff"/><g fill="#25243d" font-family="Arial,sans-serif"><text x="36" y="45" font-size="25" font-weight="700">Same measurement. Fewer zeros.</text><text x="80" y="143" font-size="48" fill="#5650a4">4.2 × 10⁶ m</text><text x="80" y="181" font-size="19">coefficient · power of ten · unit</text><text x="80" y="247" font-size="27">10³ = 1 000</text><text x="380" y="247" font-size="27">10⁻³ = 0.001</text><text x="80" y="312" font-size="20">A negative exponent does not mean a negative value.</text></g></svg>