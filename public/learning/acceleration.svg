<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Equal length tangent velocity arrows at different positions on a circular path"><rect width="820" height="260" rx="20" fill="#f6f6fb"/><style>text{font-family:Arial,sans-serif;fill:#22233a}.label{font-size:19px;font-weight:600}.small{font-size:15px}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4b4ba8"/></marker></defs><text x="40" y="35" class="label">Same speed. Different direction. Changing velocity.</text><circle cx="235" cy="145" r="77" fill="none" stroke="#b8b8d2" stroke-width="3" stroke-dasharray="6 5"/><circle cx="312" cy="145" r="8" fill="#c9573f"/><path d="M312 145 V83" stroke="#4b4ba8" stroke-width="4" marker-end="url(#arrow)"/><circle cx="235" cy="68" r="8" fill="#c9573f"/><path d="M235 68 H173" stroke="#4b4ba8" stroke-width="4" marker-end="url(#arrow)"/><text x="410" y="120" class="label">Equal arrow lengths → same speed</text><text x="410" y="159" class="label">Different arrow directions</text><text x="410" y="187" class="small">→ velocity changes → acceleration</text></svg>