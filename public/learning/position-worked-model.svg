<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" role="img" aria-label="Cart travels from minus 2 to plus 4 and back to plus 1 meters"><rect width="400" height="310" rx="15" fill="#f6f6fb"/><style>text{font-family:Arial,sans-serif;fill:#22233a;font-size:20px}.small{font-size:17px}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4b4ba8"/></marker></defs><text x="24" y="35">Right is positive →</text><line x1="35" y1="195" x2="365" y2="195" stroke="#22233a" stroke-width="2"/><path d="M65 90 H335" fill="none" stroke="#4b4ba8" stroke-width="4" marker-end="url(#arrow)"/><path d="M335 138 H200" fill="none" stroke="#4b4ba8" stroke-width="4" marker-end="url(#arrow)"/><text x="65" y="228" text-anchor="middle">−2 m</text><text x="200" y="228" text-anchor="middle">+1 m</text><text x="335" y="228" text-anchor="middle">+4 m</text><text x="65" y="264" text-anchor="middle">Start</text><text x="200" y="264" text-anchor="middle">Finish</text><text x="335" y="264" text-anchor="middle">Turn</text></svg>