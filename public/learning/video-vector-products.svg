<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Dot and cross products"><rect width="720" height="400" rx="18" fill="#f7f6ff"/><g font-family="Arial,sans-serif" fill="#25243d"><text x="32" y="42" font-size="25" font-weight="700">Two products. Two different meanings.</text><path d="M360 78V335" stroke="#c8c4db"/><g font-size="21"><text x="35" y="104" font-weight="700">Dot: a scalar</text><text x="35" y="152">A · B = AB cos θ</text><text x="35" y="196">AxBx + AyBy</text><text x="35" y="246">Zero at 90°</text><text x="35" y="298">Work: W = F · Δr</text><text x="385" y="104" font-weight="700">Cross: a vector</text><text x="385" y="152">Magnitude = AB sin θ</text><text x="385" y="196">z-component: AxBy − AyBx</text><text x="385" y="246">Right-hand-rule direction</text><text x="385" y="298">Torque: τ = r × F</text><text x="35" y="375">Component formulas shown for vectors in the xy plane.</text></g></g></svg>
