<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Vector components"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="720" height="400" rx="18" fill="#f7f6ff"/><g font-family="Arial,sans-serif" fill="#25243d"><text x="32" y="42" font-size="25" font-weight="700">Resolve one vector along two axes.</text><g fill="none" stroke-width="3" marker-end="url(#a)"><path d="M70 295H340" stroke="#8590a4"/><path d="M70 295V85" stroke="#8590a4"/><path d="M70 295L310 115" stroke="#8055a4" stroke-width="4"/></g><path d="M310 115V295" fill="none" stroke="#395cab" stroke-width="3" stroke-dasharray="7 6"/><path d="M125 295A55 55 0 0 0 114 262" fill="none" stroke="#25243d" stroke-width="2"/><g font-size="21"><text x="131" y="280">θ</text><text x="155" y="328">Ax = A cos θ</text><text x="326" y="208">Ay = A sin θ</text><text x="175" y="172">A</text><text x="346" y="302">+x</text><text x="54" y="75">+y</text><text x="475" y="118">Angle from +x</text><text x="475" y="157">Check the signs.</text><text x="475" y="257">Add x to x.</text><text x="475" y="294">Add y to y.</text><text x="32" y="378">Components describe the same vector along chosen axes.</text></g></g></svg>
