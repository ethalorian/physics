<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Metric prefixes reference"><rect width="720" height="380" rx="18" fill="#f7f6ff"/><g fill="#25243d" font-family="Arial,sans-serif"><text x="36" y="44" font-size="25" font-weight="700">One prefix = one power of ten.</text><g transform="translate(44,88)"><rect width="78" height="155" rx="10" fill="#fff" stroke="#dedbec"/><text x="39" y="44" text-anchor="middle" font-size="32" fill="#5650a4">G</text><text x="39" y="84" text-anchor="middle" font-size="18">giga</text><text x="39" y="126" text-anchor="middle" font-size="23">10⁹</text></g><g transform="translate(138,88)"><rect width="78" height="155" rx="10" fill="#fff" stroke="#dedbec"/><text x="39" y="44" text-anchor="middle" font-size="32" fill="#5650a4">M</text><text x="39" y="84" text-anchor="middle" font-size="18">mega</text><text x="39" y="126" text-anchor="middle" font-size="23">10⁶</text></g><g transform="translate(232,88)"><rect width="78" height="155" rx="10" fill="#fff" stroke="#dedbec"/><text x="39" y="44" text-anchor="middle" font-size="32" fill="#5650a4">k</text><text x="39" y="84" text-anchor="middle" font-size="18">kilo</text><text x="39" y="126" text-anchor="middle" font-size="23">10³</text></g><g transform="translate(326,88)"><rect width="78" height="155" rx="10" fill="#fff" stroke="#dedbec"/><text x="39" y="44" text-anchor="middle" font-size="32" fill="#5650a4">—</text><text x="39" y="84" text-anchor="middle" font-size="18">none</text><text x="39" y="126" text-anchor="middle" font-size="23">10⁰</text></g><g transform="translate(420,88)"><rect width="78" height="155" rx="10" fill="#fff" stroke="#dedbec"/><text x="39" y="44" text-anchor="middle" font-size="32" fill="#5650a4">m</text><text x="39" y="84" text-anchor="middle" font-size="18">milli</text><text x="39" y="126" text-anchor="middle" font-size="23">10⁻³</text></g><g transform="translate(514,88)"><rect width="78" height="155" rx="10" fill="#fff" stroke="#dedbec"/><text x="39" y="44" text-anchor="middle" font-size="32" fill="#5650a4">µ</text><text x="39" y="84" text-anchor="middle" font-size="18">micro</text><text x="39" y="126" text-anchor="middle" font-size="23">10⁻⁶</text></g><g transform="translate(608,88)"><rect width="78" height="155" rx="10" fill="#fff" stroke="#dedbec"/><text x="39" y="44" text-anchor="middle" font-size="32" fill="#5650a4">n</text><text x="39" y="84" text-anchor="middle" font-size="18">nano</text><text x="39" y="126" text-anchor="middle" font-size="23">10⁻⁹</text></g><text x="44" y="294" font-size="23">M ≠ m: capitalization changes the prefix.</text><text x="44" y="334" font-size="19">Also: centi (c) = 10⁻². The SI base unit of mass is kg.</text></g></svg>