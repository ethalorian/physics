<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Sides alone cannot verify a rectangle</title><desc id="desc">A rectangle with both diagonals is shown beside a racked parallelogram. Matching side lengths can remain unchanged while diagonals change.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Sides alone cannot verify a rectangle</text><path d="M70 125H310V295H70Z" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M70 125L310 295" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><path d="M70 295L310 125" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><path d="M430 125H655L595 295H370Z" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M430 125L595 295" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><path d="M370 295L655 125" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="135" y="102" font-size="21">check both</text><text x="440" y="102" font-size="21">racked</text><text x="100" y="331" font-size="21">diagonal 1 vs. diagonal 2</text><text x="24" y="372" font-size="18">Use your 3–4–5 layout and actual diagonal readings as evidence.</text></g></svg>