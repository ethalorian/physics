<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Unit 7: connect each paper problem to a model</title><desc id="desc">Four model boxes: charge / field; V, I, R circuits; power / energy; magnetism / motor. Each has a blank for the matching paper problem number.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Unit 7: connect each paper problem to a model</text><rect x="55" y="95" width="280" height="90" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="70" y="132" font-size="20">charge / field</text><text x="70" y="163" font-size="17">paper problem(s): ___</text><rect x="400" y="95" width="280" height="90" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="415" y="132" font-size="20">V, I, R circuits</text><text x="415" y="163" font-size="17">paper problem(s): ___</text><rect x="55" y="225" width="280" height="90" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="70" y="262" font-size="20">power / energy</text><text x="70" y="293" font-size="17">paper problem(s): ___</text><rect x="400" y="225" width="280" height="90" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="415" y="262" font-size="20">magnetism / motor</text><text x="415" y="293" font-size="17">paper problem(s): ___</text><text x="24" y="372" font-size="18">Choose the model, identify givens, then test the assumptions.</text></g></svg>