<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Voltage is energy transferred per unit charge</title><desc id="desc">A source sends a packet labeled charge q to a load. Energy transfer is marked separately as delta E, distinguishing charge flow from energy delivered.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Voltage is energy transferred per unit charge</text><rect x="65" y="125" width="165" height="150" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="495" y="125" width="165" height="150" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="82" y="164" font-size="21">source</text><text x="510" y="164" font-size="21">load</text><path d="M238 225L488 225M478.0950818741206 229.78462087522354L488 225L478.0950818741206 220.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><circle cx="355" cy="225" r="27" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="347" y="233" font-size="21">q</text><path d="M245 110L480 110M470.0950818741206 114.78462087522354L480 110L470.0950818741206 105.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="300" y="91" font-size="21">energy ΔE</text><text x="249" y="325" font-size="21">voltage = ΔE / q</text><text x="24" y="372" font-size="18">Charge is not used up by the load; energy is transferred.</text></g></svg>