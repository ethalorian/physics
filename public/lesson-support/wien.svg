<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Thermal spectra shift with temperature</title><desc id="desc">Two smooth thermal-emission curves are plotted against wavelength. The hotter curve peaks at a shorter wavelength than the cooler curve; no temperatures or exact color answer are supplied.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Thermal spectra shift with temperature</text><path d="M95 295L645 295M635.0950818741205 299.78462087522354L645 295L635.0950818741205 290.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M95 295L95 78M99.78462087522354 87.90491812587945L95 78L90.21537912477646 87.90491812587945" fill="none" stroke="#1d536b" stroke-width="3"/><text x="560" y="332" font-size="21">wavelength</text><text x="105" y="82" font-size="21">intensity</text><path d="M120 285C150 275 160 95 205 108C290 124 370 205 595 267" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M120 290C210 287 280 178 360 188C425 201 505 265 595 289" fill="none" stroke="#1d536b" stroke-width="3" /><text x="205" y="105" font-size="21">hotter</text><text x="378" y="175" font-size="21">cooler</text><text x="24" y="372" font-size="17.437629937629936">Distinguish a spectrum’s peak wavelength from its perceived visible color.</text></g></svg>