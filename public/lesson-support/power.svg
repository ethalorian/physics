<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Same lift: compare work and elapsed time</title><desc id="desc">Two identical loads move upward through the same height h. One lift takes time t1 and the other time t2. No speed or power comparison is precomputed.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Same lift: compare work and elapsed time</text><rect x="130" y="230" width="90" height="60" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="490" y="230" width="90" height="60" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="130" y="90" width="90" height="60" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="490" y="90" width="90" height="60" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M95 285L95 95M99.78462087522354 104.90491812587945L95 95L90.21537912477646 104.90491812587945" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M455 285L455 95M459.78462087522354 104.90491812587945L455 95L450.21537912477646 104.90491812587945" fill="none" stroke="#1d536b" stroke-width="3"/><text x="58" y="202" font-size="21">h</text><text x="418" y="202" font-size="21">h</text><text x="145" y="326" font-size="21">time t1</text><text x="505" y="326" font-size="21">time t2</text><text x="270" y="212" font-size="21">same load</text><text x="24" y="372" font-size="17.92200854700855">Power describes the rate of energy transfer, not the total energy alone.</text></g></svg>