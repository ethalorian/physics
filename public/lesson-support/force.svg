<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Choose the object, then add its forces</title><desc id="desc">A single box with normal force up, weight down, applied force right and friction left. Arrow lengths are symbolic and not to scale.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Choose the object, then add its forces</text><rect x="300" y="150" width="110" height="90" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M355 150L355 75M359.78462087522354 84.90491812587945L355 75L350.21537912477646 84.90491812587945" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M355 240L355 320M350.21537912477646 310.0950818741206L355 320L359.78462087522354 310.0950818741206" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M410 195L595 195M585.0950818741205 199.78462087522354L595 195L585.0950818741205 190.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M300 195L145 195M154.90491812587945 190.21537912477646L145 195L154.90491812587945 199.78462087522354" fill="none" stroke="#1d536b" stroke-width="3"/><text x="370" y="92" font-size="21">N</text><text x="370" y="319" font-size="21">mg</text><text x="460" y="181" font-size="21">F applied</text><text x="155" y="181" font-size="21">friction</text><text x="24" y="372" font-size="18">One diagram = forces ON one object. Arrows are symbolic, not to scale.</text></g></svg>