<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Displacement and restoring force point oppositely</title><desc id="desc">A wall is connected by a zigzag spring to a displaced block. Equilibrium is shown with a dashed line. Extension x points right; restoring force points left.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Displacement and restoring force point oppositely</text><path d="M85 110L85 280" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M85 200L125 200L140 175L165 225L190 175L215 225L240 175L265 225L290 200L420 200" fill="none" stroke="#1d536b" stroke-width="3" /><rect x="420" y="165" width="95" height="75" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M350 120L350 286" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><path d="M360 285L465 285M455.0950818741206 289.78462087522354L465 285L455.0950818741206 280.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="401" y="315" font-size="21">x</text><path d="M420 145L300 145M309.9049181258794 140.21537912477646L300 145L309.9049181258794 149.78462087522354" fill="none" stroke="#1d536b" stroke-width="3"/><text x="294" y="124" font-size="21">F restoring</text><text x="277" y="93" font-size="21">equilibrium</text><text x="24" y="372" font-size="18">The minus sign in F = −kx specifies direction relative to displacement.</text></g></svg>