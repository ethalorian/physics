<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Stick together: one final velocity</title><desc id="desc">Before collision, two separate carts have masses m1 and m2. After collision they are connected and share a single final velocity vf, left unknown.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Stick together: one final velocity</text><rect x="65" y="152" width="100" height="70" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="245" y="152" width="120" height="70" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="95" y="194" font-size="21">m1</text><text x="280" y="194" font-size="21">m2</text><path d="M75 130L172 130M162.09508187412055 134.78462087522354L172 130L162.09508187412055 125.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="78" y="112" font-size="21">v1</text><text x="270" y="112" font-size="21">v2</text><rect x="465" y="152" width="195" height="70" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M555 152L555 222" fill="none" stroke="#1d536b" stroke-width="3" /><text x="477" y="194" font-size="21">m1 + m2</text><text x="500" y="112" font-size="21">v final = ?</text><text x="67" y="295" font-size="21">before</text><text x="507" y="295" font-size="21">after</text><text x="24" y="372" font-size="18">Use total system momentum; do not assume kinetic energy is conserved.</text></g></svg>