<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Trace the separate branches across one source</title><desc id="desc">A source on the left connects to two parallel resistor branches. Voltage is measured across the common endpoints and currents divide at a junction; numerical values remain unknown.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Trace the separate branches across one source</text><path d="M110 280V115H630V280H110" fill="none" stroke="#1d536b" stroke-width="3" /><rect x="72" y="175" width="76" height="50" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="90" y="208" font-size="21">V</text><rect x="310" y="91" width="105" height="48" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="343" y="122" font-size="21">R2</text><path d="M220 115V215H530V115" fill="none" stroke="#1d536b" stroke-width="3" /><rect x="310" y="191" width="105" height="48" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="343" y="222" font-size="21">R3</text><text x="231" y="303" font-size="21">same two connection nodes</text><text x="24" y="372" font-size="16.543392504930967">Mark each branch current; do not replace the branch layout before labeling it.</text></g></svg>