<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Draw each support force on the hanging object</title><desc id="desc">A sign hangs from two angled ropes. Gravity points down. The two tension directions follow the two ropes upward; no numerical force is supplied.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Draw each support force on the hanging object</text><rect x="270" y="200" width="180" height="75" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M270 200L160 80" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M450 200L560 80" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M298 221L227 139M237.10069692497638 143.35613608944587L227 139L229.8664152741838 149.6199653236687" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M422 221L493 139M490.1335847258162 149.6199653236687L493 139L482.8993030750236 143.35613608944587" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M360 275L360 330M355.21537912477646 320.0950818741206L360 330L364.78462087522354 320.0950818741206" fill="none" stroke="#1d536b" stroke-width="3"/><text x="163" y="119" font-size="21">T left</text><text x="488" y="119" font-size="21">T right</text><text x="378" y="328" font-size="21">weight</text><text x="24" y="372" font-size="17.67650158061117">Decide whether the object is accelerating before writing a force balance.</text></g></svg>