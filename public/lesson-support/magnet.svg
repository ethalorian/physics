<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Magnetic field lines form continuous loops</title><desc id="desc">A bar magnet labeled N at left and S at right has curved external field paths around it. Earth’s magnetic field is associated with motion in its conducting core.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Magnetic field lines form continuous loops</text><rect x="235" y="160" width="255" height="80" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M363 160L363 240" fill="none" stroke="#1d536b" stroke-width="3" /><text x="271" y="210" font-size="28">N</text><text x="419" y="210" font-size="28">S</text><path d="M250 160C160 75 560 75 475 160" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M250 240C160 325 560 325 475 240" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M320 105L389 105M379.0950818741206 109.78462087522354L389 105L379.0950818741206 100.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M320 297L389 297M379.0950818741206 301.78462087522354L389 297L379.0950818741206 292.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="85" y="80" font-size="21">field outside the magnet</text><text x="128" y="337" font-size="18">conducting-fluid motion → planetary field</text><text x="24" y="372" font-size="18">Do not confuse the geographic axis with the magnetic axis.</text></g></svg>