<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Two samples exchange energy in one insulated system</title><desc id="desc">A hot sample and a cold sample sit inside a dashed system boundary. An internal energy-transfer arrow connects them. Their common final temperature is unknown.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Two samples exchange energy in one insulated system</text><rect x="50" y="80" width="620" height="250" rx="12" fill="none" stroke="#1d536b" stroke-dasharray="8 6"/><rect x="90" y="135" width="180" height="140" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="450" y="135" width="180" height="140" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="109" y="171" font-size="21">hot: mh, ch, Th</text><text x="469" y="171" font-size="21">cold: mc, cc, Tc</text><path d="M285 220L437 220M427.0950818741206 224.78462087522354L437 220L427.0950818741206 215.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="298" y="197" font-size="21">energy</text><text x="268" y="310" font-size="21">final T = ?</text><text x="24" y="372" font-size="17.67650158061117">Compare heat lost and gained; name possible transfer to the surroundings.</text></g></svg>