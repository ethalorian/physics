<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">An ellipse and its focus</title><desc id="desc">An elliptical orbit with the Sun off-center at one focus. Two sectors radiate from the focus, illustrating the area swept in an interval; no equal-area numerical claim is supplied.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">An ellipse and its focus</text><ellipse cx="355" cy="210" rx="265" ry="115" fill="none" stroke="#1d536b" stroke-width="3"/><circle cx="230" cy="210" r="22" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="203" y="252" font-size="21">Sun</text><path d="M230 210L109 167" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M230 210L96 230" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M230 210L602 160" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M230 210L615 230" fill="none" stroke="#1d536b" stroke-width="3" /><text x="390" y="190" font-size="21">swept area</text><text x="430" y="297" font-size="21">period T, size a</text><text x="24" y="372" font-size="18">Distinguish shape, swept area per time, and the period–size relation.</text></g></svg>