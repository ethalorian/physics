<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Two strings, one heavy object: compare the pulls</title><desc id="desc">A heavy object hangs from an upper string attached to a fixed ceiling. A second string hangs below it and is pulled downward. Upper and lower tensions are distinct unknowns.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Two strings, one heavy object: compare the pulls</text><path d="M180 90L520 90" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M350 90L350 155" fill="none" stroke="#1d536b" stroke-width="3" /><circle cx="350" cy="200" r="45" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M350 245L350 300" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M350 301L350 343M345.21537912477646 333.0950818741206L350 343L354.78462087522354 333.0950818741206" fill="none" stroke="#1d536b" stroke-width="3"/><text x="370" y="128" font-size="21">upper string</text><text x="380" y="205" font-size="21">mass m</text><text x="370" y="281" font-size="21">lower string</text><text x="88" y="185" font-size="21">slow pull?</text><text x="88" y="228" font-size="21">sharp jerk?</text><text x="24" y="372" font-size="17.437629937629936">Predict both outcomes before the demonstration; identify your assumptions.</text></g></svg>