<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Repeat readings before claiming precision</title><desc id="desc">A number line has five measured points spread between a minimum and maximum. A bracket marks maximum minus minimum; no measured values are supplied.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Repeat readings before claiming precision</text><path d="M75 225L650 225M640.0950818741205 229.78462087522354L650 225L640.0950818741205 220.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><circle cx="185" cy="225" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="235" cy="225" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="305" cy="225" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="350" cy="225" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="430" cy="225" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M185 155L430 155" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="163" y="282" font-size="21">low</text><text x="408" y="282" font-size="21">high</text><text x="210" y="136" font-size="21">spread = high − low</text><text x="92" y="329" font-size="21">same object · repeated trials · instrument resolution</text><text x="24" y="372" font-size="18">Use your actual paper readings and specify the measurement unit.</text></g></svg>