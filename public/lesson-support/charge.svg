<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Net charge and redistribution are separate ideas</title><desc id="desc">A negatively charged balloon is near a neutral wall. The wall contains equal total plus and minus symbols but permits redistribution; the student determines which side shifts.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Net charge and redistribution are separate ideas</text><circle cx="200" cy="195" r="75" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="162" y="179" font-size="28">−</text><text x="216" y="179" font-size="28">−</text><text x="162" y="224" font-size="28">−</text><text x="216" y="224" font-size="28">−</text><rect x="490" y="90" width="145" height="225" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="497" y="133" font-size="17">neutral wall</text><text x="510" y="177" font-size="21">+   −</text><text x="510" y="217" font-size="21">−   +</text><text x="510" y="257" font-size="21">+   −</text><text x="107" y="302" font-size="21">charged balloon</text><text x="298" y="194" font-size="21">redistribution?</text><text x="24" y="372" font-size="18">Track electrons; do not claim a neutral object contains no charges.</text></g></svg>