<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Choose axes along and across the ramp</title><desc id="desc">A box on a ramp with gravity vertically downward. Dashed directions are parallel and perpendicular to the incline; component magnitudes are left for the student.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Choose axes along and across the ramp</text><path d="M95 290L590 100L590 290Z" fill="none" stroke="#1d536b" stroke-width="3" /><rect x="306" y="157" width="60" height="48" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M335 185L335 313M330.21537912477646 303.0950818741206L335 313L339.78462087522354 303.0950818741206" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M365 178L482 133M474.4728669840391 141.02136326069527L482 133L471.03770939077964 132.08995351822063" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M335 162L295 66M303.22615701015997 73.30276254880275L295 66L294.39301077897807 76.98324014512853" fill="none" stroke="#1d536b" stroke-width="3"/><text x="348" y="320" font-size="21">mg</text><text x="483" y="128" font-size="21">parallel</text><text x="180" y="68" font-size="21">perpendicular</text><text x="24" y="372" font-size="18">Project the same gravity vector onto your chosen axes.</text></g></svg>