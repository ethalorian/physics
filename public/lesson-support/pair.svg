<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">An interaction pair acts on two objects</title><desc id="desc">Two separate boxes A and B. Force of B on A points left on A; force of A on B points right on B. Equal-length arrows belong to different objects.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">An interaction pair acts on two objects</text><rect x="150" y="155" width="110" height="100" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="460" y="155" width="110" height="100" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="191" y="213" font-size="21">A</text><text x="502" y="213" font-size="21">B</text><path d="M150 200L55 200M64.90491812587945 195.21537912477646L55 200L64.90491812587945 204.78462087522354" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M570 200L665 200M655.0950818741205 204.78462087522354L665 200L655.0950818741205 195.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="38" y="285" font-size="21">B pushes A</text><text x="456" y="285" font-size="21">A pushes B</text><text x="24" y="372" font-size="18">Keep the system boundary explicit before claiming forces cancel.</text></g></svg>