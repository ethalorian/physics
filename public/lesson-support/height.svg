<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Potential energy depends on the chosen zero</title><desc id="desc">A book is above a floor. Dashed lines mark floor zero and desktop zero, and a vertical dimension h reaches from floor to book.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Potential energy depends on the chosen zero</text><rect x="300" y="125" width="110" height="35" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M160 165L570 165" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M70 300L655 300" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M475 162L475 297" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="490" y="242" font-size="21">h</text><text x="76" y="329" font-size="21">floor: U = 0</text><text x="80" y="183" font-size="18">desk zero</text><text x="315" y="107" font-size="21">book</text><text x="24" y="372" font-size="18">A change in reference shifts U values, not the physical energy change.</text></g></svg>