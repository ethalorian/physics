<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Specify current and viewpoint before using the hand rule</title><desc id="desc">A straight wire carries current to the right. Two points are marked above and below the wire, with the magnetic-field directions intentionally left blank.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="23.042582417582416">Specify current and viewpoint before using the hand rule</text><path d="M60 210L665 210" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M255 210L425 210M415.0950818741206 214.78462087522354L425 210L415.0950818741206 205.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="285" y="189" font-size="21">current I</text><circle cx="375" cy="120" r="8" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="375" cy="295" r="8" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="394" y="127" font-size="21">B above = ?</text><text x="394" y="303" font-size="21">B below = ?</text><text x="60" y="83" font-size="21">⊙ out of page     ⊗ into page</text><text x="24" y="372" font-size="18">Use the right-hand rule with the stated viewing direction.</text></g></svg>