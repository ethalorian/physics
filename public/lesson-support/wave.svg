<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Propagation and particle motion are different</title><desc id="desc">A sinusoidal snapshot has a horizontal propagation arrow and a vertical motion arrow at one particle. The distance from crest to crest is wavelength.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Propagation and particle motion are different</text><path d="M100 220 C140 165,180 165,220 220 S300 275,340 220 S420 165,460 220 S540 275,580 220" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M160 96L565 96M555.0950818741205 100.78462087522354L565 96L555.0950818741205 91.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="258" y="78" font-size="21">wave propagation</text><path d="M222 270L222 167M226.78462087522354 176.90491812587945L222 167L217.21537912477646 176.90491812587945" fill="none" stroke="#1d536b" stroke-width="3"/><text x="60" y="310" font-size="21">particle displacement</text><path d="M163 141L403 141" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="264" y="129" font-size="21">λ</text><text x="24" y="372" font-size="18">Identify what travels through the system and what oscillates locally.</text></g></svg>