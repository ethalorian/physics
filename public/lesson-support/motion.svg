<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Reading change from a motion graph</title><desc id="desc">A velocity versus time graph with a sloping segment and a dashed rise-over-run triangle. Vertical rise is change in velocity; horizontal run is elapsed time.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Reading change from a motion graph</text><path d="M95 295L645 295M635.0950818741205 299.78462087522354L645 295L635.0950818741205 290.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M95 295L95 78M99.78462087522354 87.90491812587945L95 78L90.21537912477646 87.90491812587945" fill="none" stroke="#1d536b" stroke-width="3"/><text x="560" y="332" font-size="21">time t (s)</text><text x="105" y="82" font-size="21">velocity v (m/s)</text><path d="M130 255L555 115" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M210 230L495 230" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><path d="M495 230L495 135" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="305" y="258" font-size="21">Δt</text><text x="507" y="192" font-size="21">Δv</text><text x="24" y="372" font-size="18">Name the axes before interpreting slope or area.</text></g></svg>