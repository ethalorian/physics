<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Compare wavelength with the opening</title><desc id="desc">Parallel wavefronts approach a narrow opening in a barrier. Beyond the opening, curved wavefronts spread into the shadow region.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Compare wavelength with the opening</text><path d="M105 95L105 315" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M150 95L150 315" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M195 95L195 315" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M240 95L240 315" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M330 70L330 184" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M330 225L330 335" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M341.25 160A45 45 0 0 1 341.25 250" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M347.5 135A70 70 0 0 1 347.5 275" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M353.75 110A95 95 0 0 1 353.75 300" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M360 85A120 120 0 0 1 360 325" fill="none" stroke="#1d536b" stroke-width="3" /><text x="106" y="70" font-size="21">wavelength λ</text><text x="350" y="80" font-size="21">barrier</text><text x="430" y="332" font-size="21">spread beyond opening</text><text x="24" y="372" font-size="18">The opening-to-wavelength ratio matters; sketch the wavefronts.</text></g></svg>