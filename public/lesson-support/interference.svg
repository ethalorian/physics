<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Add displacements at the same place and time</title><desc id="desc">Two sinusoidal waves of opposite displacement are aligned vertically. A blank result axis invites adding their displacements; it does not imply energy is destroyed.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Add displacements at the same place and time</text><path d="M100 132 C140 77,180 77,220 132 S300 187,340 132 S420 77,460 132 S540 187,580 132" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M100 245 C140 300,180 300,220 245 S300 190,340 245 S420 300,460 245 S540 190,580 245" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M100 325L590 325" fill="none" stroke="#1d536b" stroke-width="3" /><text x="615" y="139" font-size="21">wave A</text><text x="615" y="253" font-size="21">wave B</text><text x="610" y="331" font-size="21">sum?</text><text x="24" y="372" font-size="17.67650158061117">Distinguish cancellation of displacement from an energy-accounting claim.</text></g></svg>