<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Electrical input becomes other forms of energy</title><desc id="desc">A source connects to a device with voltage V across it and current I through it. Output arrows branch into useful transfer and thermal transfer, without assigning fractions.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Electrical input becomes other forms of energy</text><rect x="60" y="130" width="150" height="140" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="315" y="130" width="165" height="140" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M219 200L304 200M294.0950818741206 204.78462087522354L304 200L294.0950818741206 195.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="235" y="180" font-size="21">I</text><text x="79" y="170" font-size="21">source</text><text x="332" y="170" font-size="21">device</text><text x="360" y="244" font-size="21">V</text><path d="M489 190L650 100M643.6888605652285 109.00941280189073L650 100L639.0196173285366 100.65665545625295" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M489 215L650 300M639.0070313585063 299.60675650401197L650 300L643.4746993240042 291.14446776936313" fill="none" stroke="#1d536b" stroke-width="3"/><text x="540" y="82" font-size="17">useful output</text><text x="533" y="326" font-size="17">thermal output</text><text x="24" y="372" font-size="17.437629937629936">First find the transfer rate; use elapsed time to find transferred energy.</text></g></svg>