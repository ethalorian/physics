<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Reduce the parallel section, then the series section</title><desc id="desc">A source feeds a series resistor R1 followed by a split into two parallel resistors R2 and R3 before returning to the source. All values are symbolic.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="24.81508875739645">Reduce the parallel section, then the series section</text><path d="M85 295V110H650V295H85" fill="none" stroke="#1d536b" stroke-width="3" /><rect x="47" y="185" width="76" height="50" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="66" y="218" font-size="21">V</text><rect x="150" y="86" width="100" height="48" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="180" y="118" font-size="21">R1</text><rect x="450" y="86" width="105" height="48" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="480" y="118" font-size="21">R2</text><path d="M340 110V215H610V110" fill="none" stroke="#1d536b" stroke-width="3" /><rect x="450" y="191" width="105" height="48" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="480" y="223" font-size="21">R3</text><text x="182" y="330" font-size="21">series part</text><text x="427" y="330" font-size="21">parallel part</text><text x="24" y="372" font-size="16.33398247322298">Keep the original topology visible while calculating the equivalent resistance.</text></g></svg>