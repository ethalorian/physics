<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A moving source changes wavefront spacing</title><desc id="desc">Three circular wavefronts have centers progressively farther right. A source moves right; a stationary observer is ahead of it. Wavefront separation is smaller ahead.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">A moving source changes wavefront spacing</text><circle cx="260" cy="205" r="140" fill="none" stroke="#1d536b" stroke-width="2"/><circle cx="280" cy="205" r="105" fill="none" stroke="#1d536b" stroke-width="2"/><circle cx="300" cy="205" r="70" fill="none" stroke="#1d536b" stroke-width="2"/><circle cx="340" cy="205" r="12" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M354 205L444 205M434.0950818741206 209.78462087522354L444 205L434.0950818741206 200.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><circle cx="580" cy="205" r="20" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="540" y="257" font-size="21">observer</text><text x="220" y="57" font-size="21">successive wavefronts</text><text x="379" y="179" font-size="21">source velocity</text><text x="24" y="372" font-size="17.67650158061117">Distinguish source frequency from the frequency received by the observer.</text></g></svg>