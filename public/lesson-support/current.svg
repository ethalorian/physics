<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Current counts charge crossing a section per time</title><desc id="desc">A wire contains moving negative charges. A vertical dashed line marks the counting section. Electron-flow direction is shown; conventional-current direction is left to determine.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Current counts charge crossing a section per time</text><rect x="65" y="160" width="590" height="90" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="110" cy="205" r="13" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="103" y="212" font-size="21">−</text><circle cx="200" cy="205" r="13" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="193" y="212" font-size="21">−</text><circle cx="290" cy="205" r="13" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="283" y="212" font-size="21">−</text><circle cx="380" cy="205" r="13" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="373" y="212" font-size="21">−</text><circle cx="470" cy="205" r="13" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="463" y="212" font-size="21">−</text><circle cx="560" cy="205" r="13" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="553" y="212" font-size="21">−</text><path d="M365 100L365 307" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><path d="M125 129L265 129M255.09508187412055 133.78462087522354L265 129L255.09508187412055 124.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="80" y="104" font-size="21">electron flow</text><text x="410" y="303" font-size="21">count charge over Δt</text><text x="24" y="372" font-size="16.75824175824176">I = charge passing / elapsed time; distinguish the two direction conventions.</text></g></svg>