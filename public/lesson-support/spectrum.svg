<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">One electromagnetic spectrum, changing wavelength</title><desc id="desc">A horizontal sequence lists radio, microwave, infrared, visible, ultraviolet, X-ray, gamma. Wavelength decreases to the right while frequency increases.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">One electromagnetic spectrum, changing wavelength</text><path d="M70 150L660 150M650.0950818741205 154.78462087522354L660 150L650.0950818741205 145.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M660 280L70 280M79.90491812587945 275.21537912477646L70 280L79.90491812587945 284.78462087522354" fill="none" stroke="#1d536b" stroke-width="3"/><text x="45" y="213" font-size="17">radio</text><text x="139" y="213" font-size="17">micro-</text><text x="233" y="213" font-size="17">infrared</text><text x="327" y="213" font-size="17">visible</text><text x="421" y="213" font-size="17">UV</text><text x="515" y="213" font-size="17">X-ray</text><text x="609" y="213" font-size="17">gamma</text><text x="140" y="129" font-size="21">frequency increases →</text><text x="140" y="317" font-size="21">← wavelength increases</text><text x="140" y="77" font-size="21">c = frequency × wavelength</text><text x="24" y="372" font-size="18">Convert the frequency unit before calculating a wavelength.</text></g></svg>