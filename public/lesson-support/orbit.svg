<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Orbit: inward gravity and tangential velocity</title><desc id="desc">Earth at the center of a circular orbit. A satellite above Earth has a tangent velocity arrow and an inward gravity arrow; these arrows are perpendicular.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Orbit: inward gravity and tangential velocity</text><circle cx="340" cy="215" r="62" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="340" cy="215" r="130" fill="none" stroke="#1d536b" stroke-dasharray="7 6"/><circle cx="340" cy="85" r="12" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M355 85L520 85M510.0950818741206 89.78462087522354L520 85L510.0950818741206 80.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M340 105L340 145M335.21537912477646 135.09508187412055L340 145L344.78462087522354 135.09508187412055" fill="none" stroke="#1d536b" stroke-width="3"/><text x="383" y="71" font-size="21">velocity tangent</text><text x="360" y="132" font-size="21">gravity inward</text><text x="309" y="222" font-size="21">Earth</text><text x="24" y="372" font-size="16.978744939271255">Falling describes the inward change in velocity, not zero horizontal motion.</text></g></svg>