<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Sound needs a material that can oscillate</title><desc id="desc">A row of particles has dense compression regions separated by sparse regions. A propagation arrow points along the row, as does a two-direction particle-motion marker.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Sound needs a material that can oscillate</text><circle cx="90" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="100" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="110" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="120" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="130" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="180" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="230" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="280" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="330" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="340" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="350" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="360" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="370" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="420" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="470" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="520" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="570" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="580" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="590" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="600" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="610" cy="215" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M110 115L610 115M600.0950818741205 119.78462087522354L610 115L600.0950818741205 110.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="225" y="95" font-size="21">propagation</text><path d="M300 275L360 275M350.0950818741206 279.78462087522354L360 275L350.0950818741206 270.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M360 295L300 295M309.9049181258794 290.21537912477646L300 295L309.9049181258794 299.78462087522354" fill="none" stroke="#1d536b" stroke-width="3"/><text x="205" y="329" font-size="21">particle motion along the wave</text><text x="24" y="372" font-size="18">A vacuum has no particles to provide this mechanical coupling.</text></g></svg>