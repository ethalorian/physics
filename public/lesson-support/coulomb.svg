<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Charge signs and separation define the interaction</title><desc id="desc">Two charged spheres q1 and q2 have center-to-center separation r. Empty space around each is reserved for the force-direction arrows.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Charge signs and separation define the interaction</text><circle cx="170" cy="200" r="45" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="550" cy="200" r="45" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="153" y="208" font-size="21">q1</text><text x="533" y="208" font-size="21">q2</text><path d="M170 113L550 113" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="350" y="97" font-size="21">r</text><text x="125" y="291" font-size="21">F on q1?</text><text x="502" y="291" font-size="21">F on q2?</text><text x="24" y="372" font-size="18">Determine direction from the signs, and magnitude from Coulomb’s law.</text></g></svg>