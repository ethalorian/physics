<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A small velocity change builds a later separation</title><desc id="desc">An unaltered path is horizontal. At a marked nudge, a second path departs at a small angle; a vertical bracket at a later time marks accumulated separation.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">A small velocity change builds a later separation</text><path d="M65 205L650 205M640.0950818741205 209.78462087522354L650 205L640.0950818741205 200.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M180 205L647 120" fill="none" stroke="#1d536b" stroke-width="3" /><circle cx="180" cy="205" r="9" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M180 205L180 145M184.78462087522354 154.90491812587945L180 145L175.21537912477646 154.90491812587945" fill="none" stroke="#1d536b" stroke-width="3"/><text x="92" y="132" font-size="21">small Δv</text><path d="M640 121L640 205" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="450" y="105" font-size="21">later separation</text><text x="240" y="277" font-size="21">lead time Δt</text><text x="78" y="235" font-size="21">nudge</text><text x="24" y="372" font-size="17.437629937629936">Separate the instantaneous change in velocity from the later displacement.</text></g></svg>