<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">An interaction can change velocity</title><desc id="desc">Two motion maps use equally spaced time samples. One has equal spacing; the other has changing spacing. A question asks which motion requires a net interaction.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">An interaction can change velocity</text><circle cx="130" cy="145" r="10" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="240" cy="145" r="10" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="350" cy="145" r="10" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="460" cy="145" r="10" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="570" cy="145" r="10" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="130" cy="265" r="10" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="180" cy="265" r="10" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="260" cy="265" r="10" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="385" cy="265" r="10" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="560" cy="265" r="10" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="65" y="108" font-size="21">motion A: equal time steps</text><text x="65" y="228" font-size="21">motion B: equal time steps</text><text x="110" y="328" font-size="21">Which requires a change in velocity?</text><text x="24" y="372" font-size="18">Distinguish motion itself from a change in motion.</text></g></svg>