<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Changing magnetic flux through a coil</title><desc id="desc">A bar magnet moves toward a coil connected by a wire loop. A second dashed magnet position allows comparing change versus rest. Current direction is not supplied.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Changing magnetic flux through a coil</text><rect x="80" y="160" width="150" height="70" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="102" y="203" font-size="21">S</text><text x="184" y="203" font-size="21">N</text><path d="M240 194L320 194M310.0950818741206 198.78462087522354L320 194L310.0950818741206 189.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><ellipse cx="380" cy="195" rx="24" ry="75" fill="none" stroke="#1d536b" stroke-width="2"/><ellipse cx="398" cy="195" rx="24" ry="75" fill="none" stroke="#1d536b" stroke-width="2"/><ellipse cx="416" cy="195" rx="24" ry="75" fill="none" stroke="#1d536b" stroke-width="2"/><ellipse cx="434" cy="195" rx="24" ry="75" fill="none" stroke="#1d536b" stroke-width="2"/><ellipse cx="452" cy="195" rx="24" ry="75" fill="none" stroke="#1d536b" stroke-width="2"/><path d="M380 270L380 318L615 318L615 105L454 105L454 120" fill="none" stroke="#1d536b" stroke-width="3" /><text x="520" y="89" font-size="21">circuit</text><text x="271" y="90" font-size="21">coil</text><text x="67" y="283" font-size="21">motion changes flux</text><text x="24" y="372" font-size="18">Compare pushing, pulling, and holding the magnet still.</text></g></svg>