<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Two masses separated by a center-to-center distance</title><desc id="desc">A large mass M and a small mass m separated by a dashed distance r measured between centers. Each experiences an inward gravitational interaction.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Two masses separated by a center-to-center distance</text><circle cx="185" cy="200" r="65" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="545" cy="200" r="25" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="173" y="207" font-size="21">M</text><text x="535" y="207" font-size="21">m</text><path d="M253 200L348 200M338.0950818741206 204.78462087522354L348 200L338.0950818741206 195.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M516 200L421 200M430.9049181258794 195.21537912477646L421 200L430.9049181258794 204.78462087522354" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M185 105L545 105" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="347" y="92" font-size="21">r</text><text x="280" y="291" font-size="21">F = G M m / r²</text><text x="24" y="372" font-size="18">Compare the same two masses while changing only separation.</text></g></svg>