<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A plane mirror and the image-location question</title><desc id="desc">A vertical mirror separates an object arrow on the left from a blank region behind the mirror. Object distance and height are labeled; image dimensions remain unknown.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">A plane mirror and the image-location question</text><path d="M375 80L375 325" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M160 290L160 140M164.78462087522354 149.90491812587945L160 140L155.21537912477646 149.90491812587945" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M160 307L375 307" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="202" y="333" font-size="21">object distance</text><text x="74" y="208" font-size="21">height</text><text x="409" y="170" font-size="21">image location?</text><text x="409" y="208" font-size="21">image height?</text><text x="321" y="66" font-size="21">mirror</text><text x="24" y="372" font-size="18">Extend reflected rays backward to locate a virtual image.</text></g></svg>