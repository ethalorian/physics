<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A field direction is defined using positive test charge</title><desc id="desc">Parallel electric-field arrows point right. A marked test charge q sits in the field, with its force direction left for the learner.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="23.46153846153846">A field direction is defined using positive test charge</text><path d="M85 115L650 115M640.0950818741205 119.78462087522354L650 115L640.0950818741205 110.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M85 190L650 190M640.0950818741205 194.78462087522354L650 190L640.0950818741205 185.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M85 265L650 265M640.0950818741205 269.78462087522354L650 265L640.0950818741205 260.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><circle cx="352" cy="190" r="32" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="343" y="198" font-size="21">q</text><text x="580" y="86" font-size="21">E →</text><text x="236" y="326" font-size="21">force on q = ?</text><text x="24" y="372" font-size="18">Keep the sign of q when relating force to electric field.</text></g></svg>