<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Before and after: keep one sign convention</title><desc id="desc">Two objects have labeled masses and velocity arrows in a before panel. In the after panel, both velocities are unknown. A rightward axis defines positive direction.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Before and after: keep one sign convention</text><text x="45" y="88" font-size="21">BEFORE</text><text x="402" y="88" font-size="21">AFTER</text><rect x="60" y="145" width="95" height="65" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="223" y="145" width="95" height="65" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="85" y="185" font-size="21">m1</text><text x="247" y="185" font-size="21">m2</text><path d="M65 128L150 128M140.09508187412055 132.78462087522354L150 128L140.09508187412055 123.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="87" y="112" font-size="21">v1</text><text x="241" y="112" font-size="21">v2</text><rect x="415" y="145" width="95" height="65" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="565" y="145" width="95" height="65" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="430" y="185" font-size="21">m1</text><text x="590" y="185" font-size="21">m2</text><text x="421" y="112" font-size="21">v1′ = ?</text><text x="570" y="112" font-size="21">v2′ = ?</text><path d="M75 293L280 293M270.0950818741206 297.78462087522354L280 293L270.0950818741206 288.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="90" y="326" font-size="21">east / right = positive</text><text x="24" y="372" font-size="18">Momentum is signed; draw the actual arrows for YOUR case.</text></g></svg>