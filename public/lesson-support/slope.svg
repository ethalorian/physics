<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Plan shows route; section shows elevation change</title><desc id="desc">The plan view shows a horizontal pipe route from above; a second section view shows the same run sloping downward with the two end elevations and horizontal run labeled.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Plan shows route; section shows elevation change</text><text x="65" y="90" font-size="21">PLAN</text><path d="M180 95L635 95" fill="none" stroke="#1d536b" stroke-width="3" /><text x="267" y="128" font-size="21">route + slope note</text><text x="65" y="222" font-size="21">SECTION</text><path d="M180 190L635 295" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M180 325L635 325" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><path d="M180 190L180 325" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><path d="M635 190L635 325" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="191" y="179" font-size="21">inlet elevation</text><text x="450" y="266" font-size="21">outlet elevation</text><text x="337" y="349" font-size="21">run</text><text x="24" y="372" font-size="16.33398247322298">Record both end elevations, slope units, and the scale from your paper drawing.</text></g></svg>