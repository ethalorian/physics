<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Track heat and work across the system boundary</title><desc id="desc">An outlined system has an incoming heat arrow Q and an outgoing work arrow W. Internal energy U is inside the system; signs depend on the indicated convention.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Track heat and work across the system boundary</text><rect x="270" y="110" width="235" height="195" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M65 202L259 202M249.09508187412055 206.78462087522354L259 202L249.09508187412055 197.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M515 202L675 202M665.0950818741205 206.78462087522354L675 202L665.0950818741205 197.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="87" y="177" font-size="21">heat Q in</text><text x="535" y="177" font-size="21">work W out</text><text x="309" y="166" font-size="21">SYSTEM</text><text x="302" y="235" font-size="21">internal energy U</text><text x="24" y="372" font-size="18">With this convention: ΔU = Q − W. State what crosses the boundary.</text></g></svg>