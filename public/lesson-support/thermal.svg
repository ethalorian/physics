<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Temperature and amount of matter are separate</title><desc id="desc">A small sample and a large sample contain different numbers of particles. Separate temperature labels T1 and T2 leave both temperatures and energy comparisons open.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Temperature and amount of matter are separate</text><rect x="80" y="160" width="140" height="130" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="350" y="85" width="275" height="205" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="105" cy="190" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="145" cy="190" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="185" cy="190" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="105" cy="245" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="145" cy="245" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="380" cy="115" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="428" cy="115" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="476" cy="115" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="524" cy="115" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="572" cy="115" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="380" cy="160" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="428" cy="160" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="476" cy="160" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="524" cy="160" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="572" cy="160" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="380" cy="205" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="428" cy="205" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="476" cy="205" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="524" cy="205" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="572" cy="205" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="380" cy="250" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="428" cy="250" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="476" cy="250" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="524" cy="250" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="572" cy="250" r="7" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="87" y="134" font-size="21">mass m1, T1</text><text x="370" y="64" font-size="21">mass m2, T2</text><text x="230" y="323" font-size="21">material / specific heat also matters</text><text x="24" y="372" font-size="18">Do not infer total thermal energy from temperature alone.</text></g></svg>