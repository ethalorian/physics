<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">The simplest standing wave on a fixed string</title><desc id="desc">A string fixed at both ends forms one half-wave bulge. Endpoint separation is L; both endpoints are nodes. No frequency is calculated.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">The simplest standing wave on a fixed string</text><path d="M90 90L90 305" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M635 90L635 305" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M90 255Q362 10 635 255" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M90 255L635 255" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><path d="M95 317L630 317" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="350" y="342" font-size="21">L</text><text x="98" y="286" font-size="21">node</text><text x="580" y="286" font-size="21">node</text><text x="300" y="106" font-size="21">one loop</text><text x="24" y="372" font-size="18">Relate the fixed-end shape to wavelength before using v = fλ.</text></g></svg>