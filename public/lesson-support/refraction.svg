<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A ray crosses between two optical media</title><desc id="desc">A ray reaches a horizontal boundary at an angle to the dashed normal. The incident and transmitted media have indices n1 and n2; the transmitted ray is left to draw.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">A ray crosses between two optical media</text><rect x="80" y="220" width="575" height="110" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M80 220L655 220" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M375 80L375 330" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><path d="M160 90L372 217M361.0442489986542 216.014342860569L372 217L365.9618877286549 207.80537112230016" fill="none" stroke="#1d536b" stroke-width="3"/><text x="465" y="159" font-size="21">medium 1: n1</text><text x="465" y="278" font-size="21">medium 2: n2</text><text x="388" y="96" font-size="21">normal</text><text x="97" y="311" font-size="21">transmitted direction = ?</text><text x="24" y="372" font-size="18">Compare speeds in the media, then predict the change in direction.</text></g></svg>