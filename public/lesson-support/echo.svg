<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">An echo travels out and back</title><desc id="desc">A source at the left sends sound to a wall at the right. Separate arrows show outgoing and returning paths, each spanning the one-way distance d.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">An echo travels out and back</text><rect x="85" y="155" width="80" height="105" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M605 85L605 320" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M175 150L590 150M580.0950818741205 154.78462087522354L590 150L580.0950818741205 145.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M590 245L175 245M184.90491812587945 240.21537912477646L175 245L184.90491812587945 249.78462087522354" fill="none" stroke="#1d536b" stroke-width="3"/><text x="290" y="129" font-size="21">outgoing: d</text><text x="290" y="278" font-size="21">return: d</text><text x="63" y="301" font-size="21">source / detector</text><text x="562" y="71" font-size="21">wall</text><text x="24" y="372" font-size="18">The recorded time is for the complete out-and-back path.</text></g></svg>