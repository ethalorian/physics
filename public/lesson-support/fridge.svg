<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A refrigerator transfers energy and requires work</title><desc id="desc">A cold region connects to a refrigerator, which connects to the warm room. A separate arrow supplies electrical work to the refrigerator.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">A refrigerator transfers energy and requires work</text><rect x="35" y="145" width="175" height="110" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="275" y="145" width="175" height="110" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="515" y="145" width="175" height="110" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="52" y="190" font-size="21">cold region</text><text x="288" y="190" font-size="21">refrigerator</text><text x="528" y="190" font-size="21">warm room</text><path d="M215 220L268 220M258.0950818741206 224.78462087522354L268 220L258.0950818741206 215.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M457 220L508 220M498.0950818741206 224.78462087522354L508 220L498.0950818741206 215.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M361 70L361 135M356.21537912477646 125.09508187412055L361 135L365.78462087522354 125.09508187412055" fill="none" stroke="#1d536b" stroke-width="3"/><text x="382" y="101" font-size="21">work in</text><text x="81" y="308" font-size="21">heat removed</text><text x="506" y="308" font-size="21">heat rejected</text><text x="24" y="372" font-size="17.437629937629936">Account for input work as well as the energy removed from the cold region.</text></g></svg>