<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Account for energy before and after</title><desc id="desc">Two same-sized system boxes, before and after, list kinetic and potential energy. An arrow for energy transfer crosses the boundary between states. Values remain unknown.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Account for energy before and after</text><rect x="70" y="105" width="225" height="190" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="425" y="105" width="225" height="190" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="90" y="139" font-size="21">BEFORE</text><text x="445" y="139" font-size="21">AFTER</text><text x="90" y="186" font-size="21">kinetic energy Kᵢ</text><text x="90" y="227" font-size="21">potential energy Uᵢ</text><text x="445" y="186" font-size="21">kinetic energy Kf</text><text x="445" y="227" font-size="21">potential energy Uf</text><path d="M305 209L416 209M406.0950818741206 213.78462087522354L416 209L406.0950818741206 204.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="300" y="272" font-size="16">transfer</text><text x="24" y="372" font-size="17.67650158061117">Choose the system and reference level; account for any energy leaving it.</text></g></svg>