<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Measure angles from the normal</title><desc id="desc">A horizontal mirror and a dashed vertical normal meet at the point of incidence. An incoming ray reaches that point; the outgoing half-plane is left for the student.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">Measure angles from the normal</text><path d="M85 275L650 275" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M365 75L365 325" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><path d="M150 110L365 270M354.19747543579757 267.9250390269206L365 270L359.910415815043 260.24827539230955" fill="none" stroke="#1d536b" stroke-width="3"/><text x="388" y="99" font-size="21">normal</text><text x="460" y="313" font-size="21">mirror surface</text><text x="220" y="185" font-size="21">incident ray</text><text x="410" y="205" font-size="21">draw the reflected ray</text><text x="24" y="372" font-size="18">Check whether an angle is measured from the normal or from the surface.</text></g></svg>