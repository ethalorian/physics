<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Check actual dimensions, then declare a drawing scale</title><desc id="desc">A pipe cross-section sits inside a wall cavity. Separate dimension markers identify pipe outside diameter and clear cavity depth; the drawing is explicitly schematic.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="24.346879535558777">Check actual dimensions, then declare a drawing scale</text><rect x="120" y="100" width="85" height="220" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="510" y="100" width="85" height="220" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="357" cy="208" r="91" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><path d="M205 80L510 80" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="235" y="63" font-size="21">clear depth</text><path d="M270 208L444 208" fill="none" stroke="#1d536b" stroke-width="3" stroke-dasharray="7 6"/><text x="299" y="192" font-size="21">outside Ø</text><text x="237" y="338" font-size="21">schematic — not to scale</text><text x="24" y="372" font-size="18">Nominal names are not measured dimensions; add your stated scale.</text></g></svg>