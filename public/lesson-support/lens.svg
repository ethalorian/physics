<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">An object near a converging lens</title><desc id="desc">A biconvex lens sits on an optical axis with focal markers F on both sides. An upright object is inside the left focal distance. The image is deliberately omitted.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">An object near a converging lens</text><path d="M70 245L660 245" fill="none" stroke="#1d536b" stroke-width="3" /><path d="M375 80Q315 205 375 325Q435 205 375 80" fill="none" stroke="#1d536b" stroke-width="3" /><circle cx="200" cy="245" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><circle cx="550" cy="245" r="4" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="193" y="276" font-size="21">F</text><text x="543" y="276" font-size="21">F</text><path d="M290 245L290 160M294.78462087522354 169.90491812587945L290 160L285.21537912477646 169.90491812587945" fill="none" stroke="#1d536b" stroke-width="3"/><text x="197" y="141" font-size="21">object</text><text x="424" y="100" font-size="21">converging lens</text><text x="24" y="372" font-size="17.92200854700855">Use the object position relative to the focal point in your explanation.</text></g></svg>