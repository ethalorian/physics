<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A timeline records change between plan and evidence</title><desc id="desc">Three connected columns are titled Planned, Observed, and Revision. The observation column requests measured numbers; the revision column connects a change to the evidence.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d536b" stroke-width="1.5"/></marker></defs><rect width="720" height="400" fill="#fff"/><g fill="#162c38" font-family="Arial, sans-serif"><text x="24" y="36" font-size="25">A timeline records change between plan and evidence</text><rect x="30" y="115" width="200" height="185" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="260" y="115" width="200" height="185" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><rect x="490" y="115" width="200" height="185" rx="5" fill="#e8f1f4" stroke="#1d536b" stroke-width="2"/><text x="49" y="155" font-size="21">PLANNED</text><text x="276" y="155" font-size="21">OBSERVED</text><text x="510" y="155" font-size="21">REVISION</text><text x="49" y="204" font-size="21">prediction</text><text x="276" y="204" font-size="21">what happened</text><text x="510" y="204" font-size="21">what changes</text><text x="49" y="244" font-size="21">before test</text><text x="276" y="244" font-size="16">measured numbers</text><text x="510" y="244" font-size="21">because…</text><path d="M232 220L257 220M247.09508187412055 224.78462087522354L257 220L247.09508187412055 215.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><path d="M462 220L487 220M477.0950818741206 224.78462087522354L487 220L477.0950818741206 215.21537912477646" fill="none" stroke="#1d536b" stroke-width="3"/><text x="24" y="372" font-size="17.67650158061117">Use your own team’s event, measurement, and reason for changing the plan.</text></g></svg>