<title id="diagram-title">Delivery robot approaching a crossing</title><desc id="diagram-description">At detection, the front of the robot is 5.0 metres from the near edge of the pedestrian crossing and moves toward it at 3.0 metres per second. The diagram shows the starting situation, not the stopping result. Sketch not to scale.</desc>
