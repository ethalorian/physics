  <text x="130" y="238" font-size="16" fill="#C05A5A">la barra que ustedes soltaron</text>

  <line x1="110" y1="340" x2="280" y2="292" stroke="#9B8EC4" stroke-width="7"/>
  <line x1="280" y1="292" x2="820" y2="130" stroke="#9B8EC4" stroke-width="5" stroke-dasharray="12 9"/>
  <circle cx="167" cy="324" r="9" fill="#4A4661"/>
  <circle cx="223" cy="308" r="9" fill="#4A4661"/>
  <circle cx="280" cy="292" r="9" fill="#4A4661"/>
  <text x="126" y="272" font-size="17" fill="#4A4661" font-weight="700">our 3 points</text>
  <text x="126" y="290" font-size="15" fill="#8B87A6">nuestros 3 puntos</text>

  <circle cx="820" cy="130" r="11" fill="#C08F2E"/>
