  <text x="110" y="362" text-anchor="middle" font-size="16" fill="#8B87A6">0</text>
  <text x="280" y="362" text-anchor="middle" font-size="16" fill="#8B87A6">15</text>
  <text x="820" y="362" text-anchor="middle" font-size="16" fill="#8B87A6">90</text>
  <text x="480" y="388" text-anchor="middle" font-size="18" fill="#4A4661">angle &#183; &#225;ngulo (&#176;)</text>

