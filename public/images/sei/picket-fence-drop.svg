  <rect x="266" y="360" width="130" height="28" rx="13" fill="#9B8EC4"/>
  <text x="331" y="380" text-anchor="middle" font-size="16" fill="#FAF9FC" font-weight="700">cushion &#183; coj&#237;n</text>

  <text x="560" y="130" font-size="20" font-weight="700" fill="#4A4661">1. Gate straight up and down.</text>
  <text x="560" y="154" font-size="17" fill="#8B87A6">La fotopuerta bien vertical.</text>
  <text x="560" y="202" font-size="20" font-weight="700" fill="#4A4661">2. DROP it. Do not push.</text>
  <text x="560" y="226" font-size="17" fill="#8B87A6">SU&#201;LTALA. No la empujes.</text>
  <text x="560" y="274" font-size="20" font-weight="700" fill="#4A4661">3. Three drops. Write g.</text>
  <text x="560" y="298" font-size="17" fill="#8B87A6">Tres ca&#237;das. Escribe g.</text>
  <text x="560" y="348" font-size="24" font-weight="700" fill="#5E8B6E">g &#8776; 9.8 m/s&#178;</text>
  <text x="560" y="376" font-size="17" fill="#5E8B6E">This is YOUR number &#183; TU n&#250;mero</text>
