  <rect x="274" y="240" width="104" height="24" rx="4" fill="#4A4661"/>
  <line x1="326" y1="180" x2="326" y2="240" stroke="#C05A5A" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="392" y="176" font-size="18" fill="#4A4661" font-weight="700">photogate</text>
  <text x="392" y="196" font-size="16" fill="#8B87A6">fotopuerta</text>

  <rect x="300" y="72" width="50" height="74" fill="#FFFFFF" stroke="#4A4661" stroke-width="3"/>
