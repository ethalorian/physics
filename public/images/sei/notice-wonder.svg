<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="system-ui, sans-serif">
  <rect width="960" height="400" fill="#FAF9FC"/>
  <rect x="40" y="40" width="420" height="320" rx="10" fill="#FFFFFF" stroke="#7FA68B" stroke-width="4"/>
  <rect x="500" y="40" width="420" height="320" rx="10" fill="#FFFFFF" stroke="#9B8EC4" stroke-width="4"/>
  <ellipse cx="110" cy="100" rx="34" ry="20" fill="none" stroke="#7FA68B" stroke-width="5"/>
  <circle cx="110" cy="100" r="9" fill="#7FA68B"/>
  <text x="160" y="94" font-size="26" font-weight="700" fill="#17142E">NOTICE × 3</text>
  <text x="160" y="122" font-size="20" fill="#4A4661">OBSERVO × 3</text>
  <text x="70" y="180" font-size="20" fill="#2B2840">Facts you can point to. · Hechos.</text>
  <text x="70" y="220" font-size="22" fill="#5E8B6E">“I notice that ___.”</text>
  <text x="70" y="252" font-size="22" fill="#5E8B6E">“Observo que ___.”</text>
  <text x="70" y="320" font-size="18" fill="#8B87A6">no interpretation yet · sin interpretar</text>
  <text x="560" y="112" font-size="60" font-weight="700" fill="#9B8EC4">?</text>
  <text x="620" y="94" font-size="26" font-weight="700" fill="#17142E">WONDER × 5+</text>
  <text x="620" y="122" font-size="20" fill="#4A4661">ME PREGUNTO × 5+</text>
  <text x="530" y="180" font-size="20" fill="#2B2840">Questions it raises. · Preguntas.</text>
  <text x="530" y="220" font-size="22" fill="#6B5FA8">“I wonder whether ___.”</text>
  <text x="530" y="252" font-size="22" fill="#6B5FA8">“Me pregunto si ___.”</text>
  <text x="530" y="320" font-size="18" fill="#8B87A6">big or small — write them all · grandes o pequeñas</text>
</svg>
