<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486"><title>Choose a revision move</title><rect width="960" height="486" fill="#fff"/><g fill="#163549" font-family="Arial,sans-serif"><text x="32" y="45" font-size="28" font-weight="bold">Choose a revision move</text><rect x="32" y="80" width="896" height="66" rx="12" fill="#eaf0f9" stroke="#7191a3"/><text x="52" y="120" font-size="23">1  Find the gap: vector components • net force • free-body diagram</text><rect x="32" y="164" width="896" height="66" rx="12" fill="#e6f2f0" stroke="#7191a3"/><text x="52" y="204" font-size="23">2  Rework one example → show the quantity, diagram, and units</text><rect x="32" y="248" width="896" height="66" rx="12" fill="#eaf0f9" stroke="#7191a3"/><text x="52" y="288" font-size="23">3  Defend it aloud: CLAIM ← EVIDENCE ← PHYSICS RELATIONSHIP</text><rect x="32" y="332" width="896" height="66" rx="12" fill="#e6f2f0" stroke="#7191a3"/><text x="52" y="372" font-size="23">4  Check the weak link → choose one specific practice move</text><text x="32" y="468" font-size="18">Point to the stage where your explanation breaks down; choose the next check.</text></g></svg>