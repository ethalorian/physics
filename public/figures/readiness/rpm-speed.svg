<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486"><title>Turn wheel RPM into road speed</title><rect width="960" height="486" fill="#fff"/><g fill="#163549" font-family="Arial,sans-serif"><text x="32" y="45" font-size="28" font-weight="bold">Turn wheel RPM into road speed</text><rect x="32" y="80" width="896" height="66" rx="12" fill="#eaf0f9" stroke="#7191a3"/><text x="52" y="120" font-size="23">Wheel turns per minute ÷ 60 → wheel turns per second</text><rect x="32" y="164" width="896" height="66" rx="12" fill="#e6f2f0" stroke="#7191a3"/><text x="52" y="204" font-size="23">Wheel diameter d → circumference C = πd (metres per turn)</text><rect x="32" y="248" width="896" height="66" rx="12" fill="#eaf0f9" stroke="#7191a3"/><text x="52" y="288" font-size="23">(turns / second) × (metres / turn) → metres / second</text><rect x="32" y="332" width="896" height="66" rx="12" fill="#e6f2f0" stroke="#7191a3"/><text x="52" y="372" font-size="23">Independent check: measured distance ÷ measured time</text><text x="32" y="468" font-size="18">One wheel revolution rolls one circumference if the wheel does not slip.</text></g></svg>